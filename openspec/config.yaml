schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  PerfHub — существующая внутренняя утилита сопровождения нагрузочного тестирования.
  Планируем постепенный рефакторинг с сохранением поведения, фирменного стиля и данных.
  Утверждённый стек: Java 17, Spring Boot/MVC, Thymeleaf, Bootstrap 5,
  Vanilla JavaScript, Maven и существующее хранение; версии из текущего pom.xml.
  Любое изменение стека, языка, хранения, сборщиков, зависимостей или версий
  требует отдельного OpenSpec-предложения и явного согласования владельца.
  Сохранять URL, HTTP/JSON-контракты, авторизацию, схему БД, интеграции и данные.
  Изменения поведения и устранение обнаруженных функциональных дефектов отделять
  от структурного рефакторинга. Все функциональные и архитектурные изменения
  проводить через OpenSpec с предварительным планом и проверками, включая
  чистый рефакторинг. Обязательный порядок: Explore → Proposal → Specs → Design
  → Tasks → Review → Apply → Verify → Archive → Git. Review владельца обязателен
  до реализации; после существенных изменений требований повторить согласование.
  Чистый рефакторинг без изменения требований оформлять через skip_specs: true
  в метаданных изменения; не придумывать функциональные требования ради delta.
  Разделять A (AS-IS), B (неутверждённый TO-BE), C (дефект/риск), D (предположение).
  Дефект не является нормативным требованием. Противоречие specs и кода сначала
  зафиксировать и предложить решение, не исправлять молча. Требования имеют
  стабильные ID и трассировку код/тест/проверка приложения/не подтверждено.
  Документация и содержимое артефактов — по-русски; машинные заголовки OpenSpec
  и идентификаторы остаются в формате схемы. Секреты в артефакты не включать.
  Аудит: docs/audit/codebase-audit.md. Правила выполнения: AGENTS.md.
  Baseline-existing-perfhub официально согласован владельцем 12.10.2026 как AS-IS.
  Основные specs после штатного переноса — база дальнейших изменений. Изменения
  НФТ, статусов, интервалов и источников порогов отложены; спорные вопросы открыты.
  Последующие specs обновлять штатным lifecycle после согласования и проверки.
  Подготовка предложения не разрешает реализацию. Archive/sync, commit, push,
  merge и deployment выполнять только по отдельной команде владельца.
  Корпоративные вызовы, миграции и работа с пользовательской БД не входят
  в подготовку документации. Небезопасные тесты не запускать, указать ограничение.
  Карта требований: docs/requirements/traceability.md; решения:
  docs/requirements/gaps-and-decisions.md; описание: docs/project-overview.md.

rules:
  proposal:
    - Описывать небольшую самостоятельную область работ, ценность и явные исключения.
    - Отличать подтверждённые наблюдения с путями файлов от предположений и будущих решений.
    - Указывать зависимости от других изменений и неизменяемые внешние контракты.
  specs:
    - Формулировать проверяемые требования и сценарии на русском, сохраняя обязательные заголовки Requirement и Scenario и маркеры WHEN/THEN.
    - Описывать ЧТО обязана делать система, давать стабильные PH-ID и сценарии с GIVEN/WHEN/THEN; трассировать к реализации и существующим тестам.
    - Не превращать дефекты и спорные особенности в норму; фиксировать их отдельно для решения владельца. Принятый baseline сохранять; новые предложения не считать согласованными без явного решения владельца.
    - При skip_specs true не создавать delta; совместимость чистого рефакторинга задавать в design/tasks и проверках, включая отрицательные сценарии и роли.
  design:
    - Обосновывать решение фактической структурой проекта; описывать альтернативы, риски, поэтапное применение и откат.
    - Разделять изменения HTML/CSS, поведения JS, Java и данных; фиксировать DOM, порядок ресурсов и HTTP-контракты при затрагивании UI.
    - Не считать потенциально устаревший код доказанно неиспользуемым без проверки достижимости.
  tasks:
    - Использовать нумерованные незавершённые пункты; каждый пункт должен иметь конкретный результат и проверку.
    - Сначала фиксировать поведение и регрессионное покрытие, затем выполнять перенос и проверку совместимости.
    - Включать review до apply, относящиеся проверки и строгую валидацию. Для кода выполнять mvn test только в безопасном изолированном окружении; для документации проверять источники, трассировку и границы diff.
    - Не включать исправления дефектов или реализацию приложения в документирующий baseline; archive и Git не выполнять автоматически.

operations:
  apply:
    guidance:
      - До реализации требуется явное согласование владельцем proposal/specs/design/tasks и отдельный запрос на применение; статус CLI ready не заменяет review.
      - Реализовывать только утверждённый объём; существенное изменение требований сначала согласовать повторно. Проверять сценарии, регрессии, стек и границы diff.
  archive:
    guidance:
      - Архивировать только после завершения задач и проверки, по отдельной команде владельца; обновлять основные specs штатным механизмом.
      - Подготовка и валидация baseline не разрешают archive/sync, commit, push, merge или deployment.
