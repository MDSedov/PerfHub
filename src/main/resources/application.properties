spring.config.import=file:./configs/application.properties

# VictoriaMetrics configuration
vm.base-url=${vm.base-url.value}
vm.query-range-path=${vm.query-range-path.value}
vm.default-step-seconds=${vm.default-step-seconds.value}

# GigaChat API configuration
gigachat.oauth-url=${gigachat.oauth-url.value}
gigachat.api-url=${gigachat.api-url.value}
gigachat.scope=${gigachat.scope.value}
gigachat.authorization-key=${gigachat.authorization-key.value}
gigachat.client-id=${gigachat.client-id.value}
gigachat.grant-type=${gigachat.grant-type.value}
gigachat.trust-store=${gigachat.trust-store.value}
gigachat.trust-store-password=${gigachat.trust-store-password.value}
gigachat.trust-store-type=${gigachat.trust-store-type.value}
gigachat.disable-ssl-validation=${gigachat.disable-ssl-validation.value}
gigachat.model=${gigachat.model.value}
gigachat.prompts-resource=${gigachat.prompts-resource.value}
gigachat.prompts-directory=${gigachat.prompts-directory.value}

# Grafana configuration
grafana.base-url=${grafana.base-url.value}
grafana.render-path=${grafana.render-path.value}
grafana.api-key=${grafana.api-key.value}
grafana.image-width=${grafana.image-width.value}
grafana.image-height=${grafana.image-height.value}
grafana.timezone=${grafana.timezone.value}

# Confluence configuration
confluence.base-url=${confluence.base-url.value}
confluence.personal-access-token=${confluence.personal-access-token.value}
