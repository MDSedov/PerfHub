spring.config.import=file:./configs/application.properties

# GigaChat prompts configuration
gigachat.prompts-resource=${gigachat.prompts-resource.value}
gigachat.prompts-directory=${gigachat.prompts-directory.value}

# Database configuration
spring.datasource.url=${spring.datasource.url.value}
spring.datasource.username=${spring.datasource.username.value}
spring.datasource.password=${spring.datasource.password.value}
spring.datasource.driver-class-name=${spring.datasource.driver-class-name.value}
spring.sql.init.mode=${spring.sql.init.mode.value}
