spring.config.import=optional:file:./configs/application.property

# VictoriaMetrics configuration
vm.base-url=${VM_BASE_URL:${vm.base-url.value}}
vm.query-range-path=${VM_QUERY_RANGE_PATH:${vm.query-range-path.value}}
vm.default-step-seconds=${VM_DEFAULT_STEP_SECONDS:${vm.default-step-seconds.value}}

# GigaChat API configuration
gigachat.oauth-url=${GIGACHAT_OAUTH_URL:${gigachat.oauth-url.value}}
gigachat.api-url=${GIGACHAT_API_URL:${gigachat.api-url.value}}
gigachat.scope=${GIGACHAT_SCOPE:${gigachat.scope.value}}
gigachat.authorization-key=${GIGACHAT_AUTHORIZATION_KEY:${gigachat.authorization-key.value}}
gigachat.client-id=${GIGACHAT_CLIENT_ID:${gigachat.client-id.value}}
gigachat.grant-type=${GIGACHAT_GRANT_TYPE:${gigachat.grant-type.value}}
gigachat.trust-store=${GIGACHAT_TRUST_STORE:${gigachat.trust-store.value:}}
gigachat.trust-store-password=${GIGACHAT_TRUST_STORE_PASSWORD:${gigachat.trust-store-password.value:}}
gigachat.trust-store-type=${GIGACHAT_TRUST_STORE_TYPE:${gigachat.trust-store-type.value:}}
gigachat.disable-ssl-validation=${GIGACHAT_DISABLE_SSL_VALIDATION:${gigachat.disable-ssl-validation.value:false}}
gigachat.model=${GIGACHAT_MODEL:${gigachat.model.value}}
gigachat.prompts-resource=${GIGACHAT_PROMPTS_RESOURCE:${gigachat.prompts-resource.value}}
gigachat.prompts-directory=${GIGACHAT_PROMPTS_DIRECTORY:${gigachat.prompts-directory.value}}

# Grafana configuration
grafana.base-url=${GRAFANA_BASE_URL:${grafana.base-url.value}}
grafana.render-path=${GRAFANA_RENDER_PATH:${grafana.render-path.value}}
grafana.api-key=${GRAFANA_API_KEY:${grafana.api-key.value:}}
grafana.image-width=${GRAFANA_IMAGE_WIDTH:${grafana.image-width.value}}
grafana.image-height=${GRAFANA_IMAGE_HEIGHT:${grafana.image-height.value}}
grafana.timezone=${GRAFANA_TIMEZONE:${grafana.timezone.value}}

# Confluence configuration
confluence.base-url=${CONFLUENCE_BASE_URL:${confluence.base-url.value:https://your-confluence-instance.atlassian.net/wiki}}
