<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PerfHub — Личный кабинет</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
        (function () {
            try {
                if (localStorage.getItem('perfhub.sidebar.collapsed') === 'true') {
                    document.documentElement.classList.add('sidebar-collapsed');
                }
            } catch (error) {
            }
        })();
    </script>
    <link rel="stylesheet" href="/css/app.css?v=perfhub-11">
</head>
<body class="bg-white">
<div class="app-shell">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <div class="page-content">
        <main class="container-fluid py-5 px-4 px-lg-5">
            <div class="d-flex justify-content-end mb-3">
                <form method="post" action="/logout">
                    <button type="submit" class="btn btn-outline-success">
                        Выйти из личного кабинета
                    </button>
                </form>
            </div>

            <div class="card settings-card profile-settings-card">
                <div class="card-body">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                        <div>
                            <h5 class="card-title mb-1">Настройки пользователя</h5>
                        </div>
                    </div>

                    <div id="profileStatus" class="alert d-none" role="alert"></div>

                    <form id="profileForm" class="profile-form">
                        <div class="row g-3">
                            <div class="col-12 col-lg-6">
                                <label for="profileUsernameInput" class="form-label">Имя пользователя</label>
                                <input type="text" class="form-control" id="profileUsernameInput" required>
                            </div>
                            <div class="col-12 col-lg-6">
                                <label for="profileRoleInput" class="form-label">Роль</label>
                                <input type="text" class="form-control" id="profileRoleInput" readonly>
                            </div>
                            <div class="col-12 col-lg-6">
                                <label for="profileFirstNameInput" class="form-label">Имя</label>
                                <input type="text" class="form-control" id="profileFirstNameInput" required>
                            </div>
                            <div class="col-12 col-lg-6">
                                <label for="profileLastNameInput" class="form-label">Фамилия</label>
                                <input type="text" class="form-control" id="profileLastNameInput">
                            </div>
                            <div class="col-12 col-lg-6">
                                <label for="profilePasswordInput" class="form-label">Новый пароль</label>
                                <input type="password"
                                       class="form-control"
                                       id="profilePasswordInput"
                                       autocomplete="new-password"
                                       placeholder="Оставьте пустым, чтобы не менять пароль">
                            </div>
                            <div class="col-12 col-lg-6">
                                <label for="profilePasswordConfirmationInput" class="form-label">Подтверждение пароля</label>
                                <input type="password"
                                       class="form-control"
                                       id="profilePasswordConfirmationInput"
                                       autocomplete="new-password"
                                       placeholder="Оставьте пустым, чтобы не менять пароль">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end mt-4">
                            <button type="submit" class="btn btn-success" id="saveProfileButton">
                                Сохранить изменения
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <div id="toastContainer" class="toast-container"></div>
    </div>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9K/Y/xFd25tOfvtTDHkJ/xZBfX0Ax7Anxr1Lk0XG"
        crossorigin="anonymous"></script>
<script src="/js/background-errors.js"></script>

<script>
    const profileStatus = document.getElementById('profileStatus');
    const profileForm = document.getElementById('profileForm');
    const profileUsernameInput = document.getElementById('profileUsernameInput');
    const profileRoleInput = document.getElementById('profileRoleInput');
    const profileFirstNameInput = document.getElementById('profileFirstNameInput');
    const profileLastNameInput = document.getElementById('profileLastNameInput');
    const profilePasswordInput = document.getElementById('profilePasswordInput');
    const profilePasswordConfirmationInput = document.getElementById('profilePasswordConfirmationInput');
    const saveProfileButton = document.getElementById('saveProfileButton');
    const toastContainer = document.getElementById('toastContainer');

    let profileBusy = false;

    function removeToast(toast) {
        if (!toast) {
            return;
        }
        const timerId = toast.dataset.timerId;
        if (timerId) {
            clearTimeout(Number(timerId));
        }
        toast.remove();
    }

    function showToast(message, type = 'info', durationMs = 12000) {
        if (!toastContainer) {
            return null;
        }
        const toast = document.createElement('div');
        toast.className = `toast-item ${type}`;
        const body = document.createElement('p');
        body.className = 'toast-body';
        body.textContent = message;
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'toast-close';
        close.setAttribute('aria-label', 'Закрыть уведомление');
        close.innerHTML = '&times;';
        close.addEventListener('click', () => removeToast(toast));
        const content = document.createElement('div');
        content.className = 'flex-grow-1';
        content.appendChild(body);
        toast.appendChild(content);
        toast.appendChild(close);
        toastContainer.appendChild(toast);
        const timerId = setTimeout(() => removeToast(toast), durationMs);
        toast.dataset.timerId = timerId.toString();
        return toast;
    }

    function extractErrorMessage(errorText, fallbackMessage) {
        if (!errorText) {
            return fallbackMessage;
        }
        try {
            const parsed = JSON.parse(errorText);
            if (typeof parsed?.message === 'string' && parsed.message.trim() !== '') {
                return parsed.message.trim();
            }
        } catch (error) {
            // ignore malformed payload
        }
        const normalized = String(errorText).trim();
        return normalized === '' ? fallbackMessage : normalized;
    }

    function setProfileStatus(message, type = 'info') {
        profileStatus.className = `alert alert-${type}`;
        profileStatus.textContent = message;
        profileStatus.classList.remove('d-none');
    }

    function clearProfileStatus() {
        profileStatus.className = 'alert d-none';
        profileStatus.textContent = '';
    }

    function setProfileBusy(isBusy) {
        profileBusy = isBusy;
        saveProfileButton.disabled = isBusy;
        saveProfileButton.textContent = isBusy ? 'Сохраняем…' : 'Сохранить изменения';
        profileForm.querySelectorAll('input').forEach(input => {
            if (input.id !== 'profileRoleInput') {
                input.disabled = isBusy;
            }
        });
    }

    function fillProfile(user) {
        profileUsernameInput.value = user?.username ?? '';
        profileFirstNameInput.value = user?.firstName ?? '';
        profileLastNameInput.value = user?.lastName ?? '';
        profileRoleInput.value = user?.roleLabel ?? '';
        profilePasswordInput.value = '';
        profilePasswordConfirmationInput.value = '';
    }

    function buildProfilePayload() {
        const payload = {
            username: profileUsernameInput.value.trim(),
            firstName: profileFirstNameInput.value.trim(),
            lastName: profileLastNameInput.value.trim(),
            password: profilePasswordInput.value,
            passwordConfirmation: profilePasswordConfirmationInput.value
        };
        if (!payload.username) {
            throw new Error('Укажите имя пользователя');
        }
        if (!payload.firstName) {
            throw new Error('Укажите имя');
        }
        if ((payload.password || payload.passwordConfirmation) && payload.password !== payload.passwordConfirmation) {
            throw new Error('Пароль и подтверждение пароля не совпадают');
        }
        return payload;
    }

    async function loadProfile() {
        clearProfileStatus();
        try {
            const response = await fetch('/api/profile');
            if (!response.ok) {
                throw new Error(extractErrorMessage(await response.text(), 'Не удалось загрузить профиль'));
            }
            fillProfile(await response.json());
        } catch (error) {
            setProfileStatus(error.message || 'Не удалось загрузить профиль', 'danger');
        }
    }

    async function saveProfile(event) {
        event.preventDefault();
        if (profileBusy) {
            return;
        }
        let payload;
        try {
            payload = buildProfilePayload();
        } catch (error) {
            showToast(error.message || 'Проверьте заполнение профиля', 'danger');
            return;
        }

        setProfileBusy(true);
        clearProfileStatus();
        try {
            const response = await fetch('/api/profile', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                throw new Error(extractErrorMessage(await response.text(), 'Не удалось сохранить профиль'));
            }
            fillProfile(await response.json());
            showToast('Настройки пользователя сохранены', 'success');
        } catch (error) {
            showToast(error.message || 'Не удалось сохранить профиль', 'danger');
        } finally {
            setProfileBusy(false);
        }
    }

    profileForm?.addEventListener('submit', saveProfile);
    document.addEventListener('DOMContentLoaded', loadProfile);
</script>
<script src="/js/sidebar-collapse.js?v=perfhub-10"></script>
</body>
</html>
