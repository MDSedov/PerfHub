<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Летописец — Настройки</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
    <style>
        body {
            background-color: #f5fff9;
            font-family: "SF Pro Display", "Roboto", "Segoe UI", sans-serif;
        }

        .navbar-sber {
            background: linear-gradient(90deg, #009846, #2cd67b);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(0, 132, 82, 0.3);
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #ffffff !important;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
        }

        .brand-logo {
            height: 42px;
            width: auto;
            border-radius: 14px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        .main-menu .nav-link {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            border-radius: 999px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .main-menu .nav-link.active,
        .main-menu .nav-link:hover,
        .main-menu .nav-link:focus-visible {
            background-color: #ffffff;
            color: #009846;
        }

        .main-menu .dropdown-toggle::after {
            margin-left: 0.35rem;
        }

        .dropdown-menu {
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 152, 70, 0.25);
            padding: 0.5rem;
            min-width: 16rem;
            max-width: min(22rem, calc(100vw - 1.5rem));
            left: auto;
            right: 0;
        }

        .dropdown-item {
            border-radius: 12px;
            padding: 0.5rem 0.9rem;
            font-weight: 500;
            color: #0b6b3c;
        }

        .dropdown-item.active,
        .dropdown-item:focus,
        .dropdown-item:hover {
            background-color: rgba(0, 152, 70, 0.12);
            color: #009846;
        }

        @media (min-width: 992px) {
            .nav-item.dropdown:hover .dropdown-menu {
                display: block;
                margin-top: 0;
            }
        }

        .settings-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 16px 50px rgba(3, 76, 45, 0.08);
        }

        .settings-menu {
            display: grid;
            gap: 1.25rem;
            grid-template-columns: 1fr;
        }

        .settings-service-title {
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #0b6b3c;
            margin-bottom: 0.75rem;
        }

        .settings-item + .settings-item {
            border-top: 1px solid rgba(0, 152, 70, 0.08);
            margin-top: 1rem;
            padding-top: 1rem;
        }

        .settings-key {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6a7c73;
        }

        .settings-description {
            font-weight: 600;
            color: #1d2822;
        }

        .integration-card .btn {
            white-space: nowrap;
        }

        .toast-container {
            position: fixed;
            right: 1.25rem;
            bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 1080;
            max-width: min(640px, calc(100vw - 2.5rem));
            width: auto;
            align-items: flex-end;
            pointer-events: none;
        }

        .toast-item {
            background: #ffffff;
            border: 1px solid #e5efe8;
            border-radius: 10px;
            padding: 0.85rem 1rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            pointer-events: auto;
            width: auto;
            max-width: 100%;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .toast-item .toast-body {
            margin: 0;
            color: #1f2b24;
        }

        .toast-close {
            border: none;
            background: transparent;
            color: #6a7c73;
            padding: 0.25rem;
            line-height: 1;
            cursor: pointer;
            margin-left: auto;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .toast-item.success {
            border-color: #b7e3c9;
            background: #f4fbf7;
        }

        .toast-item.danger {
            border-color: #f3c1b8;
            background: #fff4f2;
        }

        .toast-item.info {
            border-color: #c2d7ff;
            background: #f3f7ff;
        }

        .toast-item.warning {
            border-color: #ffe0a3;
            background: #fff8e6;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-sber">
    <div class="container-fluid align-items-center">
        <a class="navbar-brand text-decoration-none" th:href="@{/tests}">
            <img src="/img/chronicler-logo.png" alt="Летописец" class="brand-logo" loading="lazy">
            <span>Летописец</span>
        </a>
        <ul class="nav main-menu ms-3">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/tests}" th:classappend="${activePage} == 'tests' ? ' active' : ''">Тесты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/reports}" th:classappend="${activePage} == 'reports' ? ' active' : ''">Отчеты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/configuration}" th:classappend="${activePage} == 'configuration' ? ' active' : ''">Конфигурация</a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle"
                   href="#"
                   id="settingsMenu"
                   role="button"
                   data-bs-toggle="dropdown"
                   aria-expanded="false"
                   th:classappend="${activePage} == 'settings' ? ' active' : ''">
                    Настройки
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="settingsMenu">
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/connections}"
                           th:classappend="${activeSettingsSection} == 'connections' ? ' active' : ''">
                            Подключения
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/templates}"
                           th:classappend="${activeSettingsSection} == 'templates' ? ' active' : ''">
                            Шаблоны отчетов
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/grafana-dashboards}"
                           th:classappend="${activeSettingsSection} == 'grafana-dashboards' ? ' active' : ''">
                            Графики и нефункциональные требования
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<main class="container-fluid py-5 px-4 px-lg-5">
    <div class="card settings-card mb-4">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <h5 class="card-title mb-1">Подключения</h5>
                    <p class="text-muted small mb-0">Всего <span id="settingsCount">0</span> интеграций</p>
                </div>
                <div class="text-muted small">Изменения сохраняются отдельно для каждой интеграции.</div>
            </div>
            <div id="settingsStatus" class="alert d-none mt-3 mb-0" role="alert"></div>
        </div>
    </div>
    <div id="settingsList" class="settings-menu"></div>
    <div id="settingsEmpty" class="text-muted d-none">Настройки не найдены.</div>
</main>

<div id="toastContainer" class="toast-container"></div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9K/Y/xFd25tOfvtTDHkJ/xZBfX0Ax7Anxr1Lk0XG"
        crossorigin="anonymous"></script>

<script>
    const settingsList = document.getElementById('settingsList');
    const settingsStatus = document.getElementById('settingsStatus');
    const settingsEmpty = document.getElementById('settingsEmpty');
    const settingsCount = document.getElementById('settingsCount');
    const toastContainer = document.getElementById('toastContainer');

    const SERVICE_ORDER = [
        'Victoria Metrics',
        'Grafana',
        'Confluence',
        'DropApp',
        'GigaChat'
    ];
    const servicePriority = new Map(SERVICE_ORDER.map((name, index) => [name, index]));

    const settingsChanges = new Map();
    const connectionStatuses = new Map();
    const serviceCards = new Map();
    const serviceSaving = new Set();
    let settingsCache = [];

    const removeToast = (toast) => {
        if (!toast) {
            return;
        }
        const timerId = toast.dataset.timerId;
        if (timerId) {
            clearTimeout(Number(timerId));
        }
        toast.remove();
    };

    const showToast = (message, type = 'info', durationMs = 12000) => {
        if (!toastContainer) {
            return null;
        }
        const toast = document.createElement('div');
        toast.className = `toast-item ${type}`;
        const body = document.createElement('p');
        body.className = 'toast-body';
        body.textContent = message;
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'toast-close';
        close.setAttribute('aria-label', 'Закрыть уведомление');
        close.innerHTML = '&times;';
        close.addEventListener('click', () => removeToast(toast));
        const content = document.createElement('div');
        content.className = 'flex-grow-1';
        content.appendChild(body);
        toast.appendChild(content);
        toast.appendChild(close);
        toastContainer.appendChild(toast);
        const timer = setTimeout(() => removeToast(toast), durationMs);
        toast.dataset.timerId = timer.toString();
        return toast;
    };

    if (toastContainer) {
        toastContainer.addEventListener('click', event => {
            const closeButton = event.target.closest('.toast-close');
            if (!closeButton) {
                return;
            }
            const toast = closeButton.closest('.toast-item');
            removeToast(toast);
        });
    }

    function compareServices(a, b) {
        const priorityA = servicePriority.has(a) ? servicePriority.get(a) : SERVICE_ORDER.length;
        const priorityB = servicePriority.has(b) ? servicePriority.get(b) : SERVICE_ORDER.length;
        if (priorityA !== priorityB) {
            return priorityA - priorityB;
        }
        return a.localeCompare(b, 'ru');
    }

    function getCompoundKey(service, key) {
        return `${service}::${key}`;
    }

    function setSettingsStatus(message, type = 'info') {
        settingsStatus.textContent = message;
        settingsStatus.className = `alert alert-${type}`;
        settingsStatus.classList.remove('d-none');
    }

    function clearSettingsStatus() {
        settingsStatus.classList.add('d-none');
    }

    function applyStoredConnectionStatus(service, element) {
        const stored = connectionStatuses.get(service);
        if (!stored) {
            element.textContent = '';
            element.className = 'small text-muted visually-hidden';
            return;
        }
        element.textContent = stored.text;
        element.className = stored.className;
    }

    function rememberConnectionStatus(service, text, isSuccess) {
        const className = isSuccess ? 'small text-success visually-hidden' : 'small text-danger visually-hidden';
        connectionStatuses.set(service, {text, className});
        return className;
    }

    function setServiceMessage(service, message, tone = 'muted') {
        const card = serviceCards.get(service);
        if (!card) {
            return;
        }
        const baseClass = `small text-${tone} mb-2`;
        if (!message) {
            card.status.textContent = '';
            card.status.className = `${baseClass} d-none`;
            return;
        }
        card.status.textContent = message;
        card.status.className = baseClass;
    }

    function getServiceChanges(service) {
        return Array.from(settingsChanges.values()).filter(item => item.service === service);
    }

    function refreshServiceActions(service) {
        const card = serviceCards.get(service);
        if (!card) {
            return;
        }
        const hasChanges = getServiceChanges(service).length > 0;
        const isSaving = serviceSaving.has(service);
        card.saveTestButton.disabled = isSaving;
        card.resetButton.disabled = !hasChanges || isSaving;
    }

    async function checkConnection(service, button, statusElement, {showToastOnResult = false, showToastOnStart = false} = {}) {
        statusElement.className = 'small text-muted visually-hidden';
        statusElement.textContent = 'Проверяем соединение…';
        if (showToastOnStart) {
            showToast('Проверяем соединение…', 'info', 6000);
        }
        button.disabled = true;
        try {
            const response = await fetch(`/api/chronicler/connections/${encodeURIComponent(service)}/test`, {
                method: 'POST'
            });
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            const result = await response.json();
            const success = Boolean(result.success);
            const message = result.message || (success ? 'Соединение успешно' : 'Соединение не установлено');
            statusElement.className = rememberConnectionStatus(service, message, success);
            statusElement.textContent = message;
            if (showToastOnResult) {
                showToast(message, success ? 'success' : 'danger');
            }
            return {success, message};
        } catch (error) {
            const message = 'Ошибка проверки: ' + error.message;
            statusElement.className = rememberConnectionStatus(service, message, false);
            statusElement.textContent = message;
            if (showToastOnResult) {
                showToast(message, 'danger');
            }
            return {success: false, message};
        } finally {
            button.disabled = false;
        }
    }

    function getServiceItemsFromCache(service) {
        return settingsCache.filter(item => item.service === service);
    }

    function resetService(service) {
        const card = serviceCards.get(service);
        if (!card) {
            return;
        }
        const originals = new Map(getServiceItemsFromCache(service).map(item => [item.key, item.value ?? '']));
        card.inputs.forEach(input => {
            const originalValue = originals.get(input.dataset.key) ?? '';
            input.value = originalValue;
            input.dataset.originalValue = originalValue;
            settingsChanges.delete(getCompoundKey(service, input.dataset.key));
        });
        setServiceMessage(service, '', 'muted');
        showToast('Изменения отменены.', 'info');
        refreshServiceActions(service);
    }

    function updateSettingsCount() {
        if (!settingsCount) {
            return;
        }
        const uniqueServices = new Set(settingsCache.map(item => item.service));
        settingsCount.textContent = uniqueServices.size.toString();
    }

    async function saveService(service) {
        const changes = getServiceChanges(service);
        if (!changes.length) {
            return true;
        }
        serviceSaving.add(service);
        refreshServiceActions(service);
        setServiceMessage(service, 'Сохраняем изменения…', 'info');
        const payload = {
            parameters: changes.map(item => ({
                service: item.service,
                key: item.key,
                value: item.value
            }))
        };
        try {
            const response = await fetch('/api/chronicler/properties/', {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            settingsCache = await response.json();
            const keysToDelete = [];
            settingsChanges.forEach((value, key) => {
                if (value.service === service) {
                    keysToDelete.push(key);
                }
            });
            keysToDelete.forEach(key => settingsChanges.delete(key));
            updateSettingsCount();
            rebuildServiceCard(service);
            setServiceMessage(service, 'Настройки сохранены.', 'success');
            return true;
        } catch (error) {
            setServiceMessage(service, 'Не удалось сохранить: ' + error.message, 'danger');
            showToast('Не удалось сохранить: ' + error.message, 'danger');
            return false;
        } finally {
            serviceSaving.delete(service);
            refreshServiceActions(service);
        }
    }

    async function saveAndTest(service) {
        const card = serviceCards.get(service);
        if (!card) {
            return;
        }
        const hasChanges = getServiceChanges(service).length > 0;
        if (hasChanges) {
            const saved = await saveService(service);
            if (!saved) {
                return;
            }
        }
        const latestCard = serviceCards.get(service) || card;
        await checkConnection(
            service,
            latestCard.saveTestButton,
            latestCard.connectionStatus,
            {showToastOnResult: true, showToastOnStart: true}
        );
    }

    function createServiceCard(service, groupItems) {
        const card = document.createElement('div');
        card.className = 'card settings-card integration-card h-100';

        const body = document.createElement('div');
        body.className = 'card-body d-flex flex-column';

        const header = document.createElement('div');
        header.className = 'd-flex flex-wrap justify-content-between align-items-start gap-3 mb-3';

        const titleBox = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'settings-service-title mb-1';
        title.textContent = service;
        const subtitle = document.createElement('div');
        subtitle.className = 'text-muted small';
        subtitle.textContent = `${groupItems.length} параметров`;
        titleBox.appendChild(title);
        titleBox.appendChild(subtitle);

        const actions = document.createElement('div');
        actions.className = 'd-flex flex-wrap align-items-center gap-2';

        const resetButton = document.createElement('button');
        resetButton.type = 'button';
        resetButton.className = 'btn btn-outline-secondary btn-sm';
        resetButton.textContent = 'Сбросить';

        const saveTestButton = document.createElement('button');
        saveTestButton.type = 'button';
        saveTestButton.className = 'btn btn-success btn-sm';
        saveTestButton.textContent = 'Сохранить и проверить';

        const connectionStatus = document.createElement('div');
        connectionStatus.className = 'small text-muted';
        applyStoredConnectionStatus(service, connectionStatus);

        actions.appendChild(resetButton);
        actions.appendChild(saveTestButton);
        actions.appendChild(connectionStatus);

        header.appendChild(titleBox);
        header.appendChild(actions);

        const status = document.createElement('div');
        status.className = 'small text-muted mb-2 d-none';

        const fields = document.createElement('div');
        fields.className = 'd-flex flex-column gap-3';

        const cardState = {
            element: card,
            saveTestButton,
            resetButton,
            status,
            connectionStatus,
            inputs: []
        };

        groupItems.forEach(item => {
            const entry = document.createElement('div');
            entry.className = 'settings-item';

            const meta = document.createElement('div');
            meta.className = 'mb-2';
            const keyLabel = document.createElement('div');
            keyLabel.className = 'settings-key';
            keyLabel.textContent = item.key;
            const description = document.createElement('div');
            description.className = 'settings-description';
            description.textContent = item.description ?? '—';
            meta.appendChild(keyLabel);
            meta.appendChild(description);

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'form-control';
            input.value = item.value ?? '';
            input.dataset.service = item.service;
            input.dataset.key = item.key;
            input.dataset.originalValue = input.value;

            input.addEventListener('input', () => {
                const originalValue = input.dataset.originalValue ?? '';
                const compoundKey = getCompoundKey(item.service, item.key);
                if (input.value === originalValue) {
                    settingsChanges.delete(compoundKey);
                } else {
                    settingsChanges.set(compoundKey, {
                        service: item.service,
                        key: item.key,
                        value: input.value
                    });
                }
                setServiceMessage(service, '', 'muted');
                refreshServiceActions(item.service);
            });

            cardState.inputs.push(input);

            entry.appendChild(meta);
            entry.appendChild(input);
            fields.appendChild(entry);
        });

        resetButton.addEventListener('click', () => resetService(service));
        saveTestButton.addEventListener('click', () => saveAndTest(service));

        body.appendChild(header);
        body.appendChild(status);
        body.appendChild(fields);
        card.appendChild(body);

        return cardState;
    }

    function rebuildServiceCard(service) {
        const serviceItems = getServiceItemsFromCache(service);
        const newCard = createServiceCard(service, serviceItems);
        const existing = serviceCards.get(service);
        if (existing) {
            settingsList.replaceChild(newCard.element, existing.element);
        } else {
            const services = Array.from(serviceCards.keys()).sort(compareServices);
            const insertBeforeService = services.find(other => compareServices(service, other) < 0);
            if (insertBeforeService) {
                const target = serviceCards.get(insertBeforeService);
                settingsList.insertBefore(newCard.element, target.element);
            } else {
                settingsList.appendChild(newCard.element);
            }
        }
        serviceCards.set(service, newCard);
        setServiceMessage(service, '', 'muted');
        refreshServiceActions(service);
    }

    function renderSettings(items) {
        settingsList.innerHTML = '';
        settingsChanges.clear();
        serviceCards.clear();

        if (!items.length) {
            if (settingsCount) {
                settingsCount.textContent = '0';
            }
            settingsList.classList.add('d-none');
            settingsEmpty.classList.remove('d-none');
            return;
        }

        settingsList.classList.remove('d-none');
        settingsEmpty.classList.add('d-none');

        const groups = new Map();
        items.forEach(item => {
            if (!groups.has(item.service)) {
                groups.set(item.service, []);
            }
            groups.get(item.service).push(item);
        });

        const services = Array.from(groups.keys()).sort(compareServices);
        settingsCache = items;
        updateSettingsCount();

        services.forEach(service => {
            const card = createServiceCard(service, groups.get(service));
            serviceCards.set(service, card);
            settingsList.appendChild(card.element);
            refreshServiceActions(service);
        });
    }

    async function loadSettings() {
        setSettingsStatus('Загружаем настройки…', 'info');
        try {
            const response = await fetch('/api/chronicler/properties/');
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            const data = await response.json();
            settingsCache = data;
            renderSettings(settingsCache);
            clearSettingsStatus();
        } catch (error) {
            setSettingsStatus('Не удалось загрузить настройки: ' + error.message, 'danger');
        }
    }

    (async function init() {
        await loadSettings();
    })();
</script>
</body>
</html>
