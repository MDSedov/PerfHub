<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PerfHub — Настройки</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
        (function () {
            try {
                if (localStorage.getItem('perfhub.sidebar.collapsed') === 'true') {
                    document.documentElement.classList.add('sidebar-collapsed');
                }
            } catch (error) {
            }
        })();
    </script>
    <link rel="stylesheet" href="/css/app.css?v=perfhub-11">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" th:replace="~{fragments/sidebar :: sidebar}">
        <a class="sidebar-brand" th:href="@{/main}">
            <img src="/img/perfhub-logo.png?v=perfhub-4" alt="PerfHub" class="brand-logo" loading="lazy">
        </a>
        <div class="sidebar-menu">
            <a class="sidebar-link" th:href="@{/tests}"
               th:classappend="${activePage} == 'tests' ? ' active' : ''">
                <span class="sidebar-item">
                    <span class="menu-icon"><i class="bi bi-activity"></i></span>
                    <span>Тесты и отчеты</span>
                </span>
            </a>
            <a class="sidebar-link" th:href="@{/grafana-panels}"
               th:classappend="${activePage} == 'grafana-panels' ? ' active' : ''">
                <span class="sidebar-item">
                    <span class="menu-icon"><i class="bi bi-graph-up"></i></span>
                    <span>Выгрузить графики</span>
                </span>
            </a>
            <a class="sidebar-link" th:href="@{/configuration}"
               th:classappend="${activePage} == 'configuration' ? ' active' : ''">
                <span class="sidebar-item">
                    <span class="menu-icon"><i class="bi bi-gear"></i></span>
                    <span>Сохранить конфигурацию</span>
                </span>
            </a>
            <a class="sidebar-link"
               th:href="@{/settings}"
               th:classappend="${activePage} == 'settings' ? ' active' : ''">
                <span class="sidebar-item">
                    <span class="menu-icon"><i class="bi bi-sliders"></i></span>
                    <span>Настройки</span>
                </span>
            </a>
            <div class="sidebar-submenu">
                <a class="sidebar-sublink"
                   th:href="@{/settings/connections}"
                   th:classappend="${activeSettingsSection} == 'connections' ? ' active' : ''">
                    <span class="sidebar-item">
                        <span class="menu-icon"><i class="bi bi-plug"></i></span>
                        <span>Подключения</span>
                    </span>
                </a>
                <a class="sidebar-sublink"
                   th:href="@{/settings/stand-configuration}"
                   th:classappend="${activeSettingsSection} == 'stand-configuration' ? ' active' : ''">
                    <span class="sidebar-item">
                        <span class="menu-icon"><i class="bi bi-box-seam"></i></span>
                        <span>Конфигурация стенда</span>
                    </span>
                </a>
                <a class="sidebar-sublink"
                   th:href="@{/settings/templates}"
                   th:classappend="${activeSettingsSection} == 'templates' ? ' active' : ''">
                    <span class="sidebar-item">
                        <span class="menu-icon"><i class="bi bi-file-earmark-text"></i></span>
                        <span>Шаблоны отчетов</span>
                    </span>
                </a>
                <a class="sidebar-sublink"
                   th:href="@{/settings/grafana-dashboards}"
                   th:classappend="${activeSettingsSection} == 'grafana-dashboards' ? ' active' : ''">
                    <span class="sidebar-item">
                        <span class="menu-icon"><i class="bi bi-graph-up"></i></span>
                        <span>Графики и требования</span>
                    </span>
                </a>
            </div>
        </div>
    </aside>

    <div class="page-content" style="background: #ffffff; min-height: 100vh;">
<main class="container-fluid py-5 px-4 px-lg-5">
    <div class="settings-actions-bar">
        <div class="settings-actions-group">
            <button id="exportSettingsButton" type="button" class="btn btn-outline-success">
                Выгрузить настройки
            </button>
            <button id="importSettingsButton" type="button" class="btn btn-success">
                Загрузить настройки
            </button>
            <input id="importSettingsInput" type="file" accept=".json,application/json" class="d-none">
        </div>
    </div>
</main>

<div class="modal fade settings-export-modal" id="exportSettingsModal" tabindex="-1" aria-labelledby="exportSettingsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exportSettingsModalLabel">Выгрузить настройки</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <div class="settings-export-options">
                    <label class="settings-export-option">
                        <input class="form-check-input" type="checkbox" value="connections" data-export-section checked>
                        <span>Настройки подключений к внешним системам</span>
                    </label>
                    <label class="settings-export-option">
                        <input class="form-check-input" type="checkbox" value="standConfiguration" data-export-section checked>
                        <span>Настройки конфигурации стенда</span>
                    </label>
                    <label class="settings-export-option">
                        <input class="form-check-input" type="checkbox" value="reportTemplates" data-export-section checked>
                        <span>Настройки шаблонов отчетов</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-success" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-success" id="confirmExportSettingsButton">Выгрузить настройки</button>
            </div>
        </div>
    </div>
</div>

<div id="toastContainer" class="toast-container"></div>

    </div>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9K/Y/xFd25tOfvtTDHkJ/xZBfX0Ax7Anxr1Lk0XG"
        crossorigin="anonymous"></script>
<script src="/js/background-errors.js"></script>

<script>
    const toastContainer = document.getElementById('toastContainer');
    const exportSettingsButton = document.getElementById('exportSettingsButton');
    const importSettingsButton = document.getElementById('importSettingsButton');
    const importSettingsInput = document.getElementById('importSettingsInput');
    const exportSettingsModalElement = document.getElementById('exportSettingsModal');
    const confirmExportSettingsButton = document.getElementById('confirmExportSettingsButton');

    const SERVICE_ORDER = [
        'victoria-metrics',
        'grafana',
        'dropapp',
        'confluence',
        'jira',
        'gigachat'
    ];
    const CONNECTION_SERVICE_NAMES = new Set(SERVICE_ORDER);
    const SETTINGS_SECTION_LABELS = {
        connections: 'настройки подключений',
        standConfiguration: 'настройки конфигурации стенда',
        reportTemplates: 'шаблоны отчетов'
    };
    const CONNECTION_IMPORT_RESERVED_KEYS = new Set([
        'version',
        'exportedAt',
        'sections',
        'connections',
        'standConfiguration',
        'reportTemplates',
        'grafanaDashboards',
        'nonFunctionalRequirements'
    ]);
    const servicePriority = new Map(SERVICE_ORDER.map((name, index) => [name, index]));

    let settingsCache = [];
    let settingsImportInProgress = false;
    let settingsStatusToast = null;

    const exportSettingsModal = createModalController(exportSettingsModalElement);

    function setSettingsActionsDisabled(disabled) {
        [exportSettingsButton, importSettingsButton, confirmExportSettingsButton, importSettingsInput]
                .filter(Boolean)
                .forEach(element => {
                    element.disabled = disabled;
                });
    }

    function createModalController(element) {
        if (!element) {
            return null;
        }
        if (window.bootstrap?.Modal) {
            try {
                return new bootstrap.Modal(element);
            } catch (error) {
                console.warn('Не удалось инициализировать Bootstrap modal, используется резервный режим.', error);
            }
        }
        element.querySelectorAll('[data-bs-dismiss="modal"]').forEach(button => {
            button.addEventListener('click', () => hideFallbackModal(element));
        });
        element.addEventListener('click', event => {
            if (event.target === element) {
                hideFallbackModal(element);
            }
        });
        return {
            show: () => showFallbackModal(element),
            hide: () => hideFallbackModal(element)
        };
    }

    function showFallbackModal(element) {
        element.classList.add('show');
        element.removeAttribute('aria-hidden');
        element.setAttribute('aria-modal', 'true');
        element.setAttribute('role', 'dialog');
        element.style.display = 'block';
        document.body.classList.add('modal-open');
        document.body.style.overflow = 'hidden';
        if (!document.querySelector(`[data-fallback-backdrop-for="${element.id}"]`)) {
            const backdrop = document.createElement('div');
            backdrop.className = 'modal-backdrop fade show';
            backdrop.dataset.fallbackBackdropFor = element.id;
            document.body.appendChild(backdrop);
        }
        element.querySelector('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')?.focus();
    }

    function hideFallbackModal(element) {
        element.classList.remove('show');
        element.setAttribute('aria-hidden', 'true');
        element.removeAttribute('aria-modal');
        element.removeAttribute('role');
        element.style.display = 'none';
        document.querySelector(`[data-fallback-backdrop-for="${element.id}"]`)?.remove();
        if (!document.querySelector('.modal.show')) {
            document.body.classList.remove('modal-open');
            document.body.style.overflow = '';
        }
    }

    const removeToast = (toast) => {
        if (!toast) {
            return;
        }
        const timerId = toast.dataset.timerId;
        if (timerId) {
            clearTimeout(Number(timerId));
        }
        toast.remove();
    };

    const showToast = (message, type = 'info', durationMs = 12000) => {
        if (!toastContainer) {
            return null;
        }
        const toast = document.createElement('div');
        toast.className = `toast-item ${type}`;
        const body = document.createElement('p');
        body.className = 'toast-body';
        body.textContent = message;
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'toast-close';
        close.setAttribute('aria-label', 'Закрыть уведомление');
        close.innerHTML = '&times;';
        close.addEventListener('click', () => removeToast(toast));
        const content = document.createElement('div');
        content.className = 'flex-grow-1';
        content.appendChild(body);
        toast.appendChild(content);
        toast.appendChild(close);
        toastContainer.appendChild(toast);
        const timer = setTimeout(() => removeToast(toast), durationMs);
        toast.dataset.timerId = timer.toString();
        return toast;
    };

    if (toastContainer) {
        toastContainer.addEventListener('click', event => {
            const closeButton = event.target.closest('.toast-close');
            if (!closeButton) {
                return;
            }
            removeToast(closeButton.closest('.toast-item'));
        });
    }

    function compareServices(a, b) {
        const priorityA = servicePriority.has(a) ? servicePriority.get(a) : SERVICE_ORDER.length;
        const priorityB = servicePriority.has(b) ? servicePriority.get(b) : SERVICE_ORDER.length;
        if (priorityA !== priorityB) {
            return priorityA - priorityB;
        }
        return a.localeCompare(b, 'ru');
    }

    function getCompoundKey(service, key) {
        return `${service}::${key}`;
    }

    function normalizeText(value) {
        if (value === null || value === undefined) {
            return null;
        }
        const text = String(value).trim();
        return text === '' ? null : text;
    }

    function normalizeSettingValue(value) {
        if (value === null || value === undefined) {
            return '';
        }
        if (typeof value === 'string') {
            return value;
        }
        if (typeof value === 'object') {
            return JSON.stringify(value);
        }
        return String(value);
    }

    function toArray(value) {
        return Array.isArray(value) ? value : [];
    }

    function normalizeStringArray(value) {
        return toArray(value).map(normalizeText).filter(Boolean);
    }

    function createPersistentToast(type = 'info') {
        if (!toastContainer) {
            return null;
        }
        const toast = document.createElement('div');
        toast.className = `toast-item status-toast ${type}`;
        const body = document.createElement('p');
        body.className = 'toast-body';
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'toast-close';
        close.setAttribute('aria-label', 'Закрыть уведомление');
        close.innerHTML = '&times;';
        close.addEventListener('click', () => {
            removeToast(toast);
            if (settingsStatusToast === toast) {
                settingsStatusToast = null;
            }
        });
        const content = document.createElement('div');
        content.className = 'flex-grow-1';
        content.appendChild(body);
        toast.appendChild(content);
        toast.appendChild(close);
        return toast;
    }

    function setSettingsStatus(message, type = 'info') {
        if (!toastContainer) {
            return;
        }
        if (!settingsStatusToast || !settingsStatusToast.isConnected) {
            settingsStatusToast = createPersistentToast(type);
            if (!settingsStatusToast) {
                return;
            }
            toastContainer.appendChild(settingsStatusToast);
        }
        const body = settingsStatusToast.querySelector('.toast-body');
        if (body) {
            body.textContent = message;
        }
        settingsStatusToast.className = `toast-item status-toast ${type}`;
        toastContainer.appendChild(settingsStatusToast);
    }

    function clearSettingsStatus() {
        if (!settingsStatusToast) {
            return;
        }
        removeToast(settingsStatusToast);
        settingsStatusToast = null;
    }

    function extractErrorMessage(data, fallback) {
        if (data && typeof data === 'object') {
            return data.message || data.error || fallback;
        }
        if (typeof data === 'string' && data.trim()) {
            return data;
        }
        return fallback;
    }

    async function requestJson(url, options = {}) {
        const headers = {
            Accept: 'application/json',
            ...(options.body ? {'Content-Type': 'application/json'} : {}),
            ...(options.headers || {})
        };
        const response = await fetch(url, {...options, headers});
        const raw = await response.text();
        let data = null;
        if (raw) {
            try {
                data = JSON.parse(raw);
            } catch (error) {
                data = raw;
            }
        }
        if (!response.ok) {
            throw new Error(extractErrorMessage(data, `Ответ сервера: ${response.status}`));
        }
        return data;
    }

    async function testConnection(service) {
        try {
            const result = await requestJson(`/api/perfhub/connections/${encodeURIComponent(service)}/test`, {
                method: 'POST'
            });
            const success = Boolean(result?.success);
            const message = result?.message || (success ? 'Соединение успешно' : 'Соединение не установлено');
            return {success, message};
        } catch (error) {
            return {success: false, message: 'Ошибка проверки: ' + error.message};
        }
    }

    async function fetchApplicationProperties() {
        const data = await requestJson('/api/perfhub/properties/');
        settingsCache = Array.isArray(data) ? data : [];
        return settingsCache;
    }

    function collectCurrentConnectionSettings(items) {
        const grouped = {};
        const serviceNames = Array.from(new Set(toArray(items)
                .filter(item => CONNECTION_SERVICE_NAMES.has(item?.service))
                .map(item => item.service)))
                .sort(compareServices);

        serviceNames.forEach(service => {
            const serviceItems = toArray(items).filter(item => item.service === service);
            if (!serviceItems.some(item => normalizeSettingValue(item?.value).trim() !== '')) {
                return;
            }
            grouped[service] = {};
            serviceItems.forEach(item => {
                grouped[service][item.key] = item.value ?? '';
            });
        });

        return grouped;
    }

    function normalizeStandConfigurationForExport(payload) {
        return {
            namespaces: normalizeStringArray(payload?.namespaces),
            components: normalizeStringArray(payload?.components),
            services: toArray(payload?.services).map(service => ({
                namespace: normalizeText(service?.namespace),
                serviceName: normalizeText(service?.serviceName)
            })).filter(service => service.namespace && service.serviceName)
        };
    }

    function normalizeTemplateForExport(template) {
        return {
            shortName: template?.shortName ?? '',
            fullName: template?.fullName ?? '',
            reportTitle: template?.reportTitle ?? '',
            reportTitleShort: template?.reportTitleShort ?? template?.reportTitle ?? '',
            templateType: template?.templateType ?? 'TEST',
            testType: template?.testType ?? inferTemplateTestType(template),
            templatePageId: normalizeConfluencePageId(template?.templatePageId ?? template?.pageId) ?? '',
            text: template?.text ?? template?.body ?? '',
            charts: toArray(template?.charts).map(chart => ({
                title: chart?.title ?? '',
                dashboardUid: chart?.dashboardUid ?? '',
                panelId: Number(chart?.panelId ?? 0)
            }))
        };
    }

    const TEMPLATE_SUFFIX = '_template';
    const RELEASE_TEMPLATE_SHORT_NAME = 'release_template';
    let knownTestTypes = new Set(['max', 'stability', 'soak', 'psu', 'dt']);
    const TEMPLATE_TEST_TYPE_ALIASES = {
        confirm: 'stability'
    };

    async function loadKnownTestTypes() {
        try {
            const types = await requestJson('/api/test-types');
            const loaded = toArray(types)
                    .map(type => normalizeText(type?.code)?.toLowerCase())
                    .filter(type => type && type !== 'unknown');
            if (loaded.length) {
                knownTestTypes = new Set(loaded);
            }
        } catch (error) {
            // Оставляем стандартные типы как fallback.
        }
    }

    function inferTemplateType(template) {
        const explicit = normalizeText(template?.templateType)?.toUpperCase();
        if (explicit === 'RELEASE' || explicit === 'TEST') {
            return explicit;
        }
        const shortName = normalizeText(template?.shortName)?.toLowerCase() ?? '';
        return shortName === RELEASE_TEMPLATE_SHORT_NAME || shortName === 'release'
                ? 'RELEASE'
                : 'TEST';
    }

    function inferTemplateTestType(template) {
        const explicit = normalizeText(template?.testType)?.toLowerCase();
        const normalizedExplicit = TEMPLATE_TEST_TYPE_ALIASES[explicit] ?? explicit;
        if (knownTestTypes.has(normalizedExplicit)) {
            return normalizedExplicit;
        }
        const shortName = normalizeText(template?.shortName)?.toLowerCase() ?? '';
        const directShortName = TEMPLATE_TEST_TYPE_ALIASES[shortName] ?? shortName;
        if (knownTestTypes.has(directShortName)) {
            return directShortName;
        }
        if (!shortName.endsWith(TEMPLATE_SUFFIX)) {
            return '';
        }
        const candidate = shortName.slice(0, -TEMPLATE_SUFFIX.length);
        const normalizedCandidate = TEMPLATE_TEST_TYPE_ALIASES[candidate] ?? candidate;
        return knownTestTypes.has(normalizedCandidate) ? normalizedCandidate : '';
    }

    function normalizeConfluencePageId(rawValue) {
        const value = normalizeText(rawValue);
        if (!value) {
            return null;
        }
        if (/^[0-9]+$/.test(value)) {
            return value;
        }
        const queryMatch = value.match(/[?&]pageId=([0-9]+)/);
        if (queryMatch) {
            return queryMatch[1];
        }
        const pathMatch = value.match(/\/pages\/(?:viewpage\.action\/)?([0-9]+)/);
        return pathMatch ? pathMatch[1] : null;
    }

    function getSelectedExportSections() {
        return Array.from(document.querySelectorAll('[data-export-section]:checked'))
                .map(input => input.value)
                .filter(Boolean);
    }

    async function buildSettingsExportPayload(sections) {
        const selected = new Set(sections);
        const payload = {
            version: 2,
            exportedAt: new Date().toISOString(),
            sections: sections.map(section => SETTINGS_SECTION_LABELS[section] ?? section)
        };

        if (selected.has('connections')) {
            setSettingsStatus('Готовим настройки подключений…', 'info');
            payload.connections = collectCurrentConnectionSettings(await fetchApplicationProperties());
        }
        if (selected.has('standConfiguration')) {
            setSettingsStatus('Готовим настройки конфигурации стенда…', 'info');
            payload.standConfiguration = normalizeStandConfigurationForExport(
                    await requestJson('/api/settings/stand-configuration'));
        }
        if (selected.has('reportTemplates')) {
            setSettingsStatus('Готовим шаблоны отчетов…', 'info');
            await loadKnownTestTypes();
            const templates = await requestJson('/api/settings/confluence-templates/export');
            if (!Array.isArray(templates)) {
                throw new Error('Сервер вернул некорректный список шаблонов отчетов.');
            }
            payload.reportTemplates = templates.map(normalizeTemplateForExport);
        }

        return payload;
    }

    function downloadJson(payload, fileName) {
        const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
    }

    async function exportSelectedSettings() {
        const sections = getSelectedExportSections();
        if (!sections.length) {
            showToast('Выберите хотя бы один раздел настроек.', 'warning');
            return;
        }

        setSettingsActionsDisabled(true);
        try {
            const payload = await buildSettingsExportPayload(sections);
            const stamp = new Date().toISOString().replace(/[:.]/g, '-');
            downloadJson(payload, `perfhub-settings-${stamp}.json`);
            exportSettingsModal?.hide();
            setSettingsStatus('Настройки выгружены в JSON.', 'success');
        } catch (error) {
            setSettingsStatus('Не удалось выгрузить настройки: ' + error.message, 'danger');
            showToast('Не удалось выгрузить настройки: ' + error.message, 'danger');
        } finally {
            setSettingsActionsDisabled(settingsImportInProgress);
        }
    }

    function normalizeImportedConnectionEntries(rawData) {
        const entries = [];
        const addEntry = (service, key, value) => {
            const normalizedService = normalizeText(service);
            const normalizedKey = normalizeText(key);
            if (!normalizedService || !normalizedKey) {
                return;
            }
            entries.push({
                service: normalizedService,
                key: normalizedKey,
                value: normalizeSettingValue(value)
            });
        };

        if (Array.isArray(rawData)) {
            rawData.forEach(item => addEntry(item?.service, item?.key, item?.value));
            return entries;
        }

        if (!rawData || typeof rawData !== 'object') {
            return entries;
        }

        if (Array.isArray(rawData.parameters)) {
            rawData.parameters.forEach(item => addEntry(item?.service, item?.key, item?.value));
            return entries;
        }

        let connections = rawData.connections;
        if (!connections && !Object.keys(rawData).some(key => CONNECTION_IMPORT_RESERVED_KEYS.has(key))) {
            const looksLikeServiceMap = Object.values(rawData)
                    .every(value => value && typeof value === 'object' && !Array.isArray(value));
            connections = looksLikeServiceMap ? rawData : null;
        }
        if (Array.isArray(connections)) {
            connections.forEach(item => addEntry(item?.service, item?.key, item?.value));
            return entries;
        }
        if (!connections || typeof connections !== 'object') {
            return entries;
        }

        Object.entries(connections).forEach(([service, values]) => {
            if (!values || typeof values !== 'object' || Array.isArray(values)) {
                return;
            }
            Object.entries(values).forEach(([key, value]) => addEntry(service, key, value));
        });
        return entries;
    }

    async function saveImportedConnectionEntries(entries) {
        if (!settingsCache.length) {
            await fetchApplicationProperties();
        }
        const knownKeys = new Set(settingsCache
                .filter(item => CONNECTION_SERVICE_NAMES.has(item?.service))
                .map(item => getCompoundKey(item.service, item.key)));
        const parameters = [];
        const skipped = [];
        const services = new Set();

        entries.forEach(entry => {
            const compoundKey = getCompoundKey(entry.service, entry.key);
            if (!CONNECTION_SERVICE_NAMES.has(entry.service) || !knownKeys.has(compoundKey)) {
                skipped.push(`${entry.service}.${entry.key}`);
                return;
            }
            parameters.push(entry);
            services.add(entry.service);
        });

        if (parameters.length) {
            const data = await requestJson('/api/perfhub/properties/', {
                method: 'PATCH',
                body: JSON.stringify({parameters})
            });
            settingsCache = Array.isArray(data) ? data : [];
        }

        return {
            count: parameters.length,
            services: Array.from(services).sort(compareServices),
            skipped
        };
    }

    async function importStandConfiguration(rawStandConfiguration) {
        if (!rawStandConfiguration || typeof rawStandConfiguration !== 'object') {
            return 0;
        }
        const current = await requestJson('/api/settings/stand-configuration');
        const payload = {
            namespaces: Array.isArray(rawStandConfiguration.namespaces)
                    ? normalizeStringArray(rawStandConfiguration.namespaces)
                    : normalizeStringArray(current?.namespaces),
            components: Array.isArray(rawStandConfiguration.components)
                    ? normalizeStringArray(rawStandConfiguration.components)
                    : normalizeStringArray(current?.components),
            services: Array.isArray(rawStandConfiguration.services)
                    ? toArray(rawStandConfiguration.services).map(service => ({
                        namespace: normalizeText(service?.namespace),
                        serviceName: normalizeText(service?.serviceName)
                    })).filter(service => service.namespace && service.serviceName)
                    : toArray(current?.services)
        };
        await requestJson('/api/settings/stand-configuration', {
            method: 'PATCH',
            body: JSON.stringify(payload)
        });
        return 1;
    }

    function normalizeTemplatePayload(template) {
        const templateType = inferTemplateType(template);
        const testType = inferTemplateTestType(template);
        const shortName = templateType === 'RELEASE'
                ? RELEASE_TEMPLATE_SHORT_NAME
                : (testType ? `${testType}${TEMPLATE_SUFFIX}` : '');
        const reportTitle = normalizeText(template?.reportTitle)
                || normalizeText(template?.fullName)
                || shortName;
        const reportTitleShort = normalizeText(template?.reportTitleShort) || reportTitle;
        const fullName = normalizeText(template?.fullName) || reportTitle || shortName;
        const templatePageId = normalizeConfluencePageId(template?.templatePageId ?? template?.pageId);
        const text = template?.text ?? template?.body ?? '';
        if (!shortName
                || !fullName
                || !reportTitle
                || (templateType === 'TEST' && !testType)) {
            return null;
        }
        return {
            shortName,
            fullName,
            reportTitle,
            reportTitleShort,
            templateType,
            testType,
            templatePageId,
            text,
            charts: toArray(template?.charts).map(chart => ({
                title: normalizeText(chart?.title) ?? '',
                dashboardUid: normalizeText(chart?.dashboardUid) ?? '',
                panelId: Number.parseInt(chart?.panelId, 10)
            })).filter(chart => chart.title && chart.dashboardUid && Number.isFinite(chart.panelId) && chart.panelId > 0)
        };
    }

    async function importReportTemplates(rawTemplates) {
        const templates = toArray(rawTemplates);
        if (!templates.length) {
            return 0;
        }
        const existingTemplates = toArray(await requestJson('/api/settings/confluence-templates/export'));
        await loadKnownTestTypes();
        const byShortName = new Map(existingTemplates
                .map(template => [normalizeText(template?.shortName)?.toLowerCase(), template])
                .filter(([key]) => key));
        let releaseTemplate = existingTemplates.find(template =>
                String(template?.templateType ?? '').trim().toUpperCase() === 'RELEASE');
        let count = 0;
        for (const template of templates) {
            const payload = normalizeTemplatePayload(template);
            if (!payload) {
                continue;
            }
            const existing = payload.templateType === 'RELEASE'
                    ? releaseTemplate
                    : byShortName.get(payload.shortName.toLowerCase());
            const url = existing?.id
                    ? `/api/settings/confluence-templates/${existing.id}?validateCharts=false`
                    : '/api/settings/confluence-templates?validateCharts=false';
            const saved = await requestJson(url, {
                method: existing?.id ? 'PUT' : 'POST',
                body: JSON.stringify(payload)
            });
            byShortName.set(payload.shortName.toLowerCase(), saved ?? payload);
            if (payload.templateType === 'RELEASE') {
                releaseTemplate = saved ?? payload;
            }
            count += 1;
        }
        return count;
    }

    function buildImportSummary(parts) {
        const messages = [];
        if (parts.connectionCount > 0) {
            messages.push(`подключения: ${parts.connectionCount}`);
        }
        if (parts.standCount > 0) {
            messages.push('конфигурация стенда');
        }
        if (parts.templateCount > 0) {
            messages.push(`шаблоны: ${parts.templateCount}`);
        }
        return messages.length ? messages.join(', ') : 'нет примененных настроек';
    }

    async function importSettingsFromFile(file) {
        if (!file) {
            return;
        }
        settingsImportInProgress = true;
        setSettingsActionsDisabled(true);
        setSettingsStatus('Читаем файл с настройками…', 'info');
        try {
            const parsed = JSON.parse(await file.text());
            const parts = {
                connectionCount: 0,
                standCount: 0,
                templateCount: 0
            };
            let recognized = false;
            const hasIgnoredGrafanaSettings = Array.isArray(parsed?.grafanaDashboards)
                    || Array.isArray(parsed?.nonFunctionalRequirements);

            const connectionEntries = normalizeImportedConnectionEntries(parsed);
            if (connectionEntries.length) {
                recognized = true;
                setSettingsStatus('Загружаем настройки подключений…', 'info');
                const applied = await saveImportedConnectionEntries(connectionEntries);
                parts.connectionCount = applied.count;
                for (let index = 0; index < applied.services.length; index += 1) {
                    const service = applied.services[index];
                    setSettingsStatus(`Проверяем подключение ${service} (${index + 1}/${applied.services.length})…`, 'info');
                    const result = await testConnection(service);
                    if (!result.success) {
                        showToast(`${service}: ${result.message}`, 'danger');
                    }
                }
                if (applied.skipped.length) {
                    const skippedPreview = applied.skipped.slice(0, 4).join(', ');
                    const suffix = applied.skipped.length > 4 ? ' и другие' : '';
                    showToast(`Пропущены неизвестные настройки: ${skippedPreview}${suffix}.`, 'info');
                }
            }

            if (parsed?.standConfiguration) {
                recognized = true;
                setSettingsStatus('Загружаем настройки конфигурации стенда…', 'info');
                parts.standCount = await importStandConfiguration(parsed.standConfiguration);
            }

            if (Array.isArray(parsed?.reportTemplates)) {
                recognized = true;
                setSettingsStatus('Загружаем шаблоны отчетов…', 'info');
                parts.templateCount = await importReportTemplates(parsed.reportTemplates);
            }

            if (!recognized) {
                if (hasIgnoredGrafanaSettings) {
                    setSettingsStatus(
                            'В файле есть только графики и требования. Эти данные больше не загружаются из JSON.',
                            'info');
                    showToast(
                            'Графики и требования из файла пропущены: они запрашиваются из Grafana.',
                            'info',
                            6000);
                    return;
                }
                throw new Error('Неподдерживаемый формат файла. Используйте JSON из кнопки "Выгрузить настройки".');
            }

            const summary = buildImportSummary(parts);
            setSettingsStatus('Настройки загружены из JSON: ' + summary + '.', 'success');
            if (hasIgnoredGrafanaSettings) {
                showToast(
                        'Графики и требования из файла пропущены: они запрашиваются из Grafana.',
                        'info',
                        6000);
            }
            showToast('Настройки загружены из JSON.', 'success', 6000);
        } catch (error) {
            setSettingsStatus('Не удалось загрузить настройки: ' + error.message, 'danger');
            showToast('Не удалось загрузить настройки: ' + error.message, 'danger');
        } finally {
            settingsImportInProgress = false;
            if (importSettingsInput) {
                importSettingsInput.value = '';
            }
            setSettingsActionsDisabled(false);
        }
    }

    async function loadSettings() {
        setSettingsStatus('Загружаем настройки…', 'info');
        setSettingsActionsDisabled(true);
        try {
            await fetchApplicationProperties();
            clearSettingsStatus();
        } catch (error) {
            setSettingsStatus('Не удалось загрузить настройки: ' + error.message, 'danger');
        } finally {
            setSettingsActionsDisabled(settingsImportInProgress);
        }
    }

    if (exportSettingsButton) {
        exportSettingsButton.addEventListener('click', () => {
            document.querySelectorAll('[data-export-section]').forEach(input => {
                input.checked = true;
            });
            exportSettingsModal?.show();
        });
    }

    if (confirmExportSettingsButton) {
        confirmExportSettingsButton.addEventListener('click', () => {
            void exportSelectedSettings();
        });
    }

    if (importSettingsButton && importSettingsInput) {
        importSettingsButton.addEventListener('click', () => {
            if (settingsImportInProgress) {
                return;
            }
            importSettingsInput.value = '';
            importSettingsInput.click();
        });
        importSettingsInput.addEventListener('change', event => {
            const [file] = event.target.files || [];
            void importSettingsFromFile(file);
        });
    }

    if (typeof startBackgroundErrorPolling === 'function') {
        startBackgroundErrorPolling(showToast);
    }

    (async function init() {
        await loadKnownTestTypes();
        await loadSettings();
    })();
</script>
