<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Летописец — Настройки</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
    <style>
        body {
            background-color: #f5fff9;
            font-family: "SF Pro Display", "Roboto", "Segoe UI", sans-serif;
        }

        .navbar-sber {
            background: linear-gradient(90deg, #009846, #2cd67b);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(0, 132, 82, 0.3);
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #ffffff !important;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
        }

        .brand-logo {
            height: 42px;
            width: auto;
            border-radius: 14px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        .main-menu .nav-link {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            border-radius: 999px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .main-menu .nav-link.active,
        .main-menu .nav-link:hover,
        .main-menu .nav-link:focus-visible {
            background-color: #ffffff;
            color: #009846;
        }

        .main-menu .dropdown-toggle::after {
            margin-left: 0.35rem;
        }

        .dropdown-menu {
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 152, 70, 0.25);
            padding: 0.5rem;
            min-width: 16rem;
            max-width: min(22rem, calc(100vw - 1.5rem));
            left: auto;
            right: 0;
        }

        .dropdown-item {
            border-radius: 12px;
            padding: 0.5rem 0.9rem;
            font-weight: 500;
            color: #0b6b3c;
        }

        .dropdown-item.active,
        .dropdown-item:focus,
        .dropdown-item:hover {
            background-color: rgba(0, 152, 70, 0.12);
            color: #009846;
        }

        @media (min-width: 992px) {
            .nav-item.dropdown:hover .dropdown-menu {
                display: block;
                margin-top: 0;
            }
        }

        .settings-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 16px 50px rgba(3, 76, 45, 0.08);
        }

        .settings-menu {
            max-height: none;
            overflow: visible;
        }

        .settings-group + .settings-group {
            border-top: 1px solid rgba(0, 152, 70, 0.15);
            margin-top: 1.5rem;
            padding-top: 1.5rem;
        }

        .settings-service-title {
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #0b6b3c;
            margin-bottom: 0.75rem;
        }

        .settings-item + .settings-item {
            border-top: 1px solid rgba(0, 152, 70, 0.08);
            margin-top: 1rem;
            padding-top: 1rem;
        }

        .settings-key {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6a7c73;
        }

        .settings-description {
            font-weight: 600;
            color: #1d2822;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-sber">
    <div class="container-fluid align-items-center">
        <a class="navbar-brand text-decoration-none" th:href="@{/tests}">
            <img src="/img/chronicler-logo.png" alt="Летописец" class="brand-logo" loading="lazy">
            <span>Летописец</span>
        </a>
        <ul class="nav main-menu ms-3">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/tests}" th:classappend="${activePage} == 'tests' ? ' active' : ''">Тесты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/reports}" th:classappend="${activePage} == 'reports' ? ' active' : ''">Отчеты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/configuration}" th:classappend="${activePage} == 'configuration' ? ' active' : ''">Конфигурация</a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle"
                   href="#"
                   id="settingsMenu"
                   role="button"
                   data-bs-toggle="dropdown"
                   aria-expanded="false"
                   th:classappend="${activePage} == 'settings' ? ' active' : ''">
                    Настройки
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="settingsMenu">
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/connections}"
                           th:classappend="${activeSettingsSection} == 'connections' ? ' active' : ''">
                            Подключения
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/templates}"
                           th:classappend="${activeSettingsSection} == 'templates' ? ' active' : ''">
                            Шаблоны отчетов
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/requirements}"
                           th:classappend="${activeSettingsSection} == 'requirements' ? ' active' : ''">
                            Нефункциональные требования
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/victoria-metrics}"
                           th:classappend="${activeSettingsSection} == 'victoria-metrics' ? ' active' : ''">
                            Запросы в Victoria Metrics
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/grafana-dashboards}"
                           th:classappend="${activeSettingsSection} == 'grafana-dashboards' ? ' active' : ''">
                            Дашборды Grafana
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<main class="container-fluid py-5 px-4 px-lg-5">
    <div class="card settings-card">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <div>
                    <h5 class="card-title mb-1">Подключения</h5>
                    <p class="text-muted small mb-0">Всего <span id="settingsCount">0</span> параметров подключения</p>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="reloadSettingsButton">Сбросить</button>
                    <button type="button" class="btn btn-success btn-sm" id="saveSettingsButton" disabled>Сохранить</button>
                </div>
            </div>
            <div id="settingsStatus" class="alert d-none" role="alert"></div>
            <div id="settingsList" class="settings-menu"></div>
            <div id="settingsEmpty" class="text-muted d-none">Настройки не найдены.</div>
        </div>
    </div>
</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9K/Y/xFd25tOfvtTDHkJ/xZBfX0Ax7Anxr1Lk0XG"
        crossorigin="anonymous"></script>

<script>
    const settingsList = document.getElementById('settingsList');
    const settingsStatus = document.getElementById('settingsStatus');
    const settingsEmpty = document.getElementById('settingsEmpty');
    const saveSettingsButton = document.getElementById('saveSettingsButton');
    const reloadSettingsButton = document.getElementById('reloadSettingsButton');
    const settingsCount = document.getElementById('settingsCount');

    const settingsChanges = new Map();
    const connectionStatuses = new Map();
    let settingsCache = [];
    let isSettingsSaving = false;

    function getCompoundKey(service, key) {
        return `${service}::${key}`;
    }

    function setSettingsStatus(message, type = 'info') {
        settingsStatus.textContent = message;
        settingsStatus.className = `alert alert-${type}`;
        settingsStatus.classList.remove('d-none');
    }

    function clearSettingsStatus() {
        settingsStatus.classList.add('d-none');
    }

    function toggleSaveSettingsButton() {
        saveSettingsButton.disabled = settingsChanges.size === 0 || isSettingsSaving;
    }

    function applyStoredConnectionStatus(service, element) {
        const stored = connectionStatuses.get(service);
        if (!stored) {
            element.textContent = '';
            element.className = 'small text-muted';
            return;
        }
        element.textContent = stored.text;
        element.className = stored.className;
    }

    function rememberConnectionStatus(service, text, isSuccess) {
        const className = isSuccess ? 'small text-success' : 'small text-danger';
        connectionStatuses.set(service, {text, className});
        return className;
    }

    async function checkConnection(service, button, statusElement) {
        statusElement.className = 'small text-muted';
        statusElement.textContent = 'Проверяем...';
        button.disabled = true;
        try {
            const response = await fetch(`/api/chronicler/connections/${encodeURIComponent(service)}/test`, {
                method: 'POST'
            });
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            const result = await response.json();
            const success = Boolean(result.success);
            const message = result.message || (success ? 'Соединение успешно' : 'Соединение не установлено');
            statusElement.className = rememberConnectionStatus(service, message, success);
            statusElement.textContent = message;
        } catch (error) {
            const message = 'Ошибка проверки: ' + error.message;
            statusElement.className = rememberConnectionStatus(service, message, false);
            statusElement.textContent = message;
        } finally {
            button.disabled = false;
        }
    }

    function renderSettings(items) {
        settingsList.innerHTML = '';
        settingsChanges.clear();
        toggleSaveSettingsButton();

        if (settingsCount) {
            settingsCount.textContent = items.length.toString();
        }

        if (!items.length) {
            settingsList.classList.add('d-none');
            settingsEmpty.classList.remove('d-none');
            return;
        }

        settingsList.classList.remove('d-none');
        settingsEmpty.classList.add('d-none');

        const groups = new Map();
        items.forEach(item => {
            if (!groups.has(item.service)) {
                groups.set(item.service, []);
            }
            groups.get(item.service).push(item);
        });

        groups.forEach((groupItems, service) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'settings-group';

            const header = document.createElement('div');
            header.className = 'd-flex flex-wrap justify-content-between align-items-center mb-2 gap-2';

            const title = document.createElement('div');
            title.className = 'settings-service-title mb-0';
            title.textContent = service;

            const actions = document.createElement('div');
            actions.className = 'd-flex align-items-center gap-2 flex-wrap';

            const testButton = document.createElement('button');
            testButton.type = 'button';
            testButton.className = 'btn btn-outline-success btn-sm';
            testButton.textContent = 'Проверить соединение';

            const status = document.createElement('div');
            status.className = 'small text-muted';
            applyStoredConnectionStatus(service, status);

            testButton.addEventListener('click', () => checkConnection(service, testButton, status));

            actions.appendChild(testButton);
            actions.appendChild(status);
            header.appendChild(title);
            header.appendChild(actions);
            wrapper.appendChild(header);

            groupItems.forEach(item => {
                const entry = document.createElement('div');
                entry.className = 'settings-item';

                const meta = document.createElement('div');
                meta.className = 'mb-2';
                const keyLabel = document.createElement('div');
                keyLabel.className = 'settings-key';
                keyLabel.textContent = item.key;
                const description = document.createElement('div');
                description.className = 'settings-description';
                description.textContent = item.description ?? '—';
                meta.appendChild(keyLabel);
                meta.appendChild(description);

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'form-control';
                input.value = item.value ?? '';
                const originalValue = input.value;

                input.addEventListener('input', () => {
                    const compoundKey = getCompoundKey(item.service, item.key);
                    if (input.value === originalValue) {
                        settingsChanges.delete(compoundKey);
                    } else {
                        settingsChanges.set(compoundKey, {
                            service: item.service,
                            key: item.key,
                            value: input.value
                        });
                    }
                    toggleSaveSettingsButton();
                });

                entry.appendChild(meta);
                entry.appendChild(input);
                wrapper.appendChild(entry);
            });

            settingsList.appendChild(wrapper);
        });
    }

    async function loadSettings() {
        setSettingsStatus('Загружаем настройки…', 'info');
        try {
            const response = await fetch('/api/chronicler/properties/');
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            settingsCache = await response.json();
            renderSettings(settingsCache);
            clearSettingsStatus();
        } catch (error) {
            setSettingsStatus('Не удалось загрузить настройки: ' + error.message, 'danger');
        }
    }

    async function saveSettings() {
        if (settingsChanges.size === 0) {
            return;
        }
        isSettingsSaving = true;
        toggleSaveSettingsButton();
        setSettingsStatus('Сохраняем изменения…', 'info');
        const payload = {
            parameters: Array.from(settingsChanges.values()).map(item => ({
                service: item.service,
                key: item.key,
                value: item.value
            }))
        };
        try {
            const response = await fetch('/api/chronicler/properties/', {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            settingsCache = await response.json();
            renderSettings(settingsCache);
            setSettingsStatus('Настройки сохранены.', 'success');
        } catch (error) {
            setSettingsStatus('Не удалось сохранить настройки: ' + error.message, 'danger');
        } finally {
            isSettingsSaving = false;
            toggleSaveSettingsButton();
        }
    }

    saveSettingsButton.addEventListener('click', saveSettings);
    reloadSettingsButton.addEventListener('click', loadSettings);

    (async function init() {
        await loadSettings();
    })();
</script>
</body>
</html>
