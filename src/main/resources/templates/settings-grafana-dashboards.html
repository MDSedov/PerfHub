<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Летописец — Дашборды Grafana</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
    <style>
        body {
            background-color: #f5fff9;
            font-family: "SF Pro Display", "Roboto", "Segoe UI", sans-serif;
        }

        .navbar-sber {
            background: linear-gradient(90deg, #009846, #2cd67b);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(0, 132, 82, 0.3);
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #ffffff !important;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
        }

        .brand-logo {
            height: 42px;
            width: auto;
            border-radius: 14px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        .main-menu .nav-link {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            border-radius: 999px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .main-menu .nav-link.active,
        .main-menu .nav-link:hover,
        .main-menu .nav-link:focus-visible {
            background-color: #ffffff;
            color: #009846;
        }

        .main-menu .dropdown-toggle::after {
            margin-left: 0.35rem;
        }

        .dropdown-menu {
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 152, 70, 0.25);
            padding: 0.5rem;
            min-width: 16rem;
            max-width: min(22rem, calc(100vw - 1.5rem));
            left: auto;
            right: 0;
        }

        .dropdown-item {
            border-radius: 12px;
            padding: 0.5rem 0.9rem;
            font-weight: 500;
            color: #0b6b3c;
        }

        .dropdown-item.active,
        .dropdown-item:focus,
        .dropdown-item:hover {
            background-color: rgba(0, 152, 70, 0.12);
            color: #009846;
        }

        @media (min-width: 992px) {
            .nav-item.dropdown:hover .dropdown-menu {
                display: block;
                margin-top: 0;
            }
        }

        .dashboard-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 16px 50px rgba(3, 76, 45, 0.08);
        }

        .dashboard-card + .dashboard-card {
            margin-top: 1.25rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-sber">
    <div class="container-fluid align-items-center">
        <a class="navbar-brand text-decoration-none" th:href="@{/tests}">
            <img src="/img/chronicler-logo.png" alt="Летописец" class="brand-logo" loading="lazy">
            <span>Летописец</span>
        </a>
        <ul class="nav main-menu ms-3">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/tests}" th:classappend="${activePage} == 'tests' ? ' active' : ''">Тесты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/reports}" th:classappend="${activePage} == 'reports' ? ' active' : ''">Отчеты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/configuration}" th:classappend="${activePage} == 'configuration' ? ' active' : ''">Конфигурация</a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle"
                   href="#"
                   id="settingsMenu"
                   role="button"
                   data-bs-toggle="dropdown"
                   aria-expanded="false"
                   th:classappend="${activePage} == 'settings' ? ' active' : ''">
                    Настройки
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="settingsMenu">
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/connections}"
                           th:classappend="${activeSettingsSection} == 'connections' ? ' active' : ''">
                            Подключения
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/templates}"
                           th:classappend="${activeSettingsSection} == 'templates' ? ' active' : ''">
                            Шаблоны отчетов
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/requirements}"
                           th:classappend="${activeSettingsSection} == 'requirements' ? ' active' : ''">
                            Нефункциональные требования
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/victoria-metrics}"
                           th:classappend="${activeSettingsSection} == 'victoria-metrics' ? ' active' : ''">
                            Запросы в Victoria Metrics
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/grafana-dashboards}"
                           th:classappend="${activeSettingsSection} == 'grafana-dashboards' ? ' active' : ''">
                            Дашборды Grafana
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<main class="container-fluid py-5 px-4 px-lg-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h5 class="mb-1">Дашборды Grafana</h5>
            <p class="text-muted small mb-0">Укажите UID, slug и панели для рендера.</p>
        </div>
        <button type="button" class="btn btn-success" id="addDashboardButton">Добавить дашборд</button>
    </div>
    <div id="dashboardsStatus" class="alert d-none" role="alert"></div>
    <div id="dashboardsList"></div>
    <div id="dashboardsEmpty" class="text-muted">Дашборды отсутствуют.</div>
</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9K/Y/xFd25tOfvtTDHkJ/xZBfX0Ax7Anxr1Lk0XG"
        crossorigin="anonymous"></script>
<script>
    const dashboardsList = document.getElementById('dashboardsList');
    const dashboardsEmpty = document.getElementById('dashboardsEmpty');
    const dashboardsStatus = document.getElementById('dashboardsStatus');
    const addDashboardButton = document.getElementById('addDashboardButton');

    function setDashboardsStatus(message, type = 'info') {
        dashboardsStatus.textContent = message;
        dashboardsStatus.className = `alert alert-${type}`;
        dashboardsStatus.classList.remove('d-none');
    }

    function clearDashboardsStatus() {
        dashboardsStatus.classList.add('d-none');
    }

    function renderDashboards(items) {
        dashboardsList.innerHTML = '';
        if (!items.length) {
            dashboardsEmpty.classList.remove('d-none');
            return;
        }
        dashboardsEmpty.classList.add('d-none');
        items.forEach(item => dashboardsList.appendChild(buildDashboardCard(item)));
    }

    function buildDashboardCard(item) {
        const card = document.createElement('div');
        card.className = 'card dashboard-card';
        card.dataset.dashboardUid = item?.uid ?? '';
        card.dataset.isNew = (!item || !item.uid).toString();

        const body = document.createElement('div');
        body.className = 'card-body';

        const row = document.createElement('div');
        row.className = 'row g-3';

        const uidCol = buildInputColumn('col-md-3', 'UID', 'uid', item?.uid ?? '');
        if (item?.uid) {
            uidCol.querySelector('input').readOnly = true;
        }
        row.appendChild(uidCol);
        row.appendChild(buildInputColumn('col-md-4', 'Slug', 'slug', item?.slug ?? ''));
        row.appendChild(buildInputColumn('col-md-5', 'Панели (через запятую)', 'panels', formatPanels(item?.panels)));

        body.appendChild(row);

        const helper = document.createElement('div');
        helper.className = 'text-muted small mt-2';
        helper.textContent = 'Пример панелей: 1, 2, 3';
        body.appendChild(helper);

        const footer = document.createElement('div');
        footer.className = 'd-flex justify-content-between align-items-center mt-3';
        const meta = document.createElement('div');
        meta.className = 'text-muted small';
        meta.textContent = item?.uid ? `UID ${item.uid}` : 'Новый дашборд';
        footer.appendChild(meta);

        const actions = document.createElement('div');
        actions.className = 'd-flex gap-2';

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'btn btn-outline-danger btn-sm';
        deleteButton.textContent = 'Удалить';
        deleteButton.addEventListener('click', () => deleteDashboard(card));

        const saveButton = document.createElement('button');
        saveButton.type = 'button';
        saveButton.className = 'btn btn-success btn-sm';
        saveButton.textContent = 'Сохранить';
        saveButton.addEventListener('click', () => saveDashboard(card));

        actions.appendChild(deleteButton);
        actions.appendChild(saveButton);
        footer.appendChild(actions);
        body.appendChild(footer);

        card.appendChild(body);
        return card;
    }

    function buildInputColumn(colClass, labelText, field, value) {
        const col = document.createElement('div');
        col.className = colClass;
        const label = document.createElement('label');
        label.className = 'form-label';
        label.textContent = labelText;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'form-control dashboard-input';
        input.dataset.field = field;
        input.value = value ?? '';
        col.appendChild(label);
        col.appendChild(input);
        return col;
    }

    function formatPanels(panels) {
        if (!panels || !panels.length) {
            return '';
        }
        return panels.join(', ');
    }

    function parsePanels(raw) {
        if (!raw || !raw.trim()) {
            return [];
        }
        const values = raw.split(',').map(item => item.trim()).filter(Boolean);
        const parsed = values.map(value => {
            const number = Number.parseInt(value, 10);
            if (Number.isNaN(number)) {
                throw new Error(`Некорректный номер панели: ${value}`);
            }
            return number;
        });
        return parsed;
    }

    function getDashboardPayload(card) {
        const payload = {};
        const inputs = card.querySelectorAll('.dashboard-input');
        inputs.forEach(input => {
            const field = input.dataset.field;
            if (field === 'panels') {
                payload.panels = parsePanels(input.value);
            } else {
                payload[field] = input.value;
            }
        });
        return payload;
    }

    async function loadDashboards() {
        setDashboardsStatus('Загружаем дашборды…');
        try {
            const response = await fetch('/api/settings/grafana-dashboards');
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            const data = await response.json();
            renderDashboards(data);
            clearDashboardsStatus();
        } catch (error) {
            setDashboardsStatus('Не удалось загрузить дашборды: ' + error.message, 'danger');
        }
    }

    async function saveDashboard(card) {
        try {
            const payload = getDashboardPayload(card);
            if (!payload.uid || !payload.uid.trim()) {
                throw new Error('UID обязателен.');
            }
            if (!payload.slug || !payload.slug.trim()) {
                throw new Error('Slug обязателен.');
            }
            const isNew = card.dataset.isNew === 'true';
            const uid = card.dataset.dashboardUid || payload.uid;
            const method = isNew ? 'POST' : 'PUT';
            const url = isNew
                    ? '/api/settings/grafana-dashboards'
                    : `/api/settings/grafana-dashboards/${uid}`;
            const response = await fetch(url, {
                method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            const saved = await response.json();
            const updatedCard = buildDashboardCard(saved);
            dashboardsList.replaceChild(updatedCard, card);
            setDashboardsStatus('Дашборд сохранен.', 'success');
        } catch (error) {
            setDashboardsStatus(error.message, 'danger');
        }
    }

    async function deleteDashboard(card) {
        const isNew = card.dataset.isNew === 'true';
        if (isNew) {
            card.remove();
            if (!dashboardsList.children.length) {
                dashboardsEmpty.classList.remove('d-none');
            }
            return;
        }
        if (!confirm('Удалить дашборд?')) {
            return;
        }
        try {
            const uid = card.dataset.dashboardUid;
            const response = await fetch(`/api/settings/grafana-dashboards/${uid}`, {method: 'DELETE'});
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            card.remove();
            setDashboardsStatus('Дашборд удален.', 'success');
            if (!dashboardsList.children.length) {
                dashboardsEmpty.classList.remove('d-none');
            }
        } catch (error) {
            setDashboardsStatus('Не удалось удалить дашборд: ' + error.message, 'danger');
        }
    }

    function addDashboard() {
        const card = buildDashboardCard(null);
        dashboardsList.prepend(card);
        dashboardsEmpty.classList.add('d-none');
    }

    addDashboardButton.addEventListener('click', addDashboard);

    (async function init() {
        await loadDashboards();
    })();
</script>
</body>
</html>
