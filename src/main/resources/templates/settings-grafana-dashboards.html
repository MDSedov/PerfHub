                <div class="data-panel-actions d-flex flex-wrap gap-2 justify-content-end">

                                <i class="bi bi-grid"></i>
                                <span id="dashboardFilterLabel">Дашборд</span>

                                    График

                                          data-bs-toggle="tooltip"
                                          data-bs-title="Название графика из дашборда Grafana. Полное название также доступно при наведении на строку графика.">
                                        <i class="bi bi-question"></i>
                                    </span>
                                </span>
                            </th>
                            <th scope="col">
                                <span class="grafana-dashboard-column-label">
                                    № графика
                                    <span class="grafana-dashboard-help"
                                          role="button"
                                          tabindex="0"
                                          data-bs-toggle="tooltip"
                                          data-bs-title="Номер панели графика внутри дашборда Grafana.">
                                        <i class="bi bi-question"></i>
                                    </span>
                                </span>
                            </th>
                            <th scope="col">
                                <span class="grafana-dashboard-column-label">
                                    Запрос
                                    <span class="grafana-dashboard-help"
                                          role="button"
                                          tabindex="0"
                                          data-bs-toggle="tooltip"
                                          data-bs-title="Запрос графика из Grafana с подставленными значениями переменных дашборда.">
                                        <i class="bi bi-question"></i>
                                    </span>
                                </span>

                            <th scope="col">
                                <span class="grafana-dashboard-column-label">
                                    Требование
                                    <span class="grafana-dashboard-help"

                                          tabindex="0"
                                          data-bs-toggle="tooltip"

<div id="toastContainer" class="toast-container"></div>

    </div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9K/Y/xFd25tOfvtTDHkJ/xZBfX0Ax7Anxr1Lk0XG"
        crossorigin="anonymous"></script>
<script src="/js/background-errors.js"></script>
<script>
    const dashboardsTableBody = document.getElementById('dashboardsTableBody');
    const dashboardFilterList = document.getElementById('dashboardFilterList');
    const dashboardFilterLabel = document.getElementById('dashboardFilterLabel');
    const panelTitleFilterInput = document.getElementById('panelTitleFilterInput');
    const resetDashboardFiltersButton = document.getElementById('resetDashboardFiltersButton');
    const dashboardFilterDropdown = document.querySelector('.grafana-dashboard-filters .dropdown');
    const dashboardFilterToggle = dashboardFilterDropdown?.querySelector('.filter-chip');
    const dashboardFilterMenu = dashboardFilterDropdown?.querySelector('.dropdown-menu');
    const dashboardsStatus = document.getElementById('dashboardsStatus');
    const fetchDashboardsButton = document.getElementById('fetchDashboardsButton');
    const saveDashboardsButton = document.getElementById('saveDashboardsButton');
    const toastContainer = document.getElementById('toastContainer');
    const DASHBOARD_TABLE_COLSPAN = 5;
    let dashboardsState = [];
    let dashboardFilterSelection = new Set();
    let activeFallbackTooltip = null;

    const removeToast = (toast) => {
        if (!toast) {
            return;
        }
        const timerId = toast.dataset.timerId;
        if (timerId) {
            clearTimeout(Number(timerId));
        }
        toast.remove();
    };

    const showToast = (message, type = 'info', durationMs = 12000) => {
        if (!toastContainer) {
            return null;
        }
        const toast = document.createElement('div');
        toast.className = `toast-item ${type}`;
        const body = document.createElement('p');
        body.className = 'toast-body';
        body.textContent = message;
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'toast-close';
        close.setAttribute('aria-label', 'Закрыть уведомление');
        close.innerHTML = '&times;';
        close.addEventListener('click', () => removeToast(toast));
        const content = document.createElement('div');
        content.className = 'flex-grow-1';
        content.appendChild(body);
        toast.appendChild(content);
        toast.appendChild(close);
        toastContainer.appendChild(toast);
        const timer = setTimeout(() => removeToast(toast), durationMs);
        toast.dataset.timerId = timer.toString();
        return toast;
    };

    if (toastContainer) {
        toastContainer.addEventListener('click', event => {
            const closeButton = event.target.closest('.toast-close');
            if (!closeButton) {
                return;
            }
            const toast = closeButton.closest('.toast-item');
            removeToast(toast);
        });
    }

    function setDashboardsStatus(message, type = 'info') {
        dashboardsStatus.textContent = message;
        dashboardsStatus.className = `alert alert-${type} visually-hidden`;
        showToast(message, type);
    }

    function clearDashboardsStatus() {
        dashboardsStatus.className = 'alert d-none';
        dashboardsStatus.textContent = '';
    }

    function normalizeText(value) {
        if (value === undefined || value === null) {
            return null;
        }
        const text = String(value).trim();
        return text === '' ? null : text;
    }

    function sanitizeId(value) {
        return (normalizeText(value) ?? 'empty').replace(/[^a-zA-Z0-9_-]/g, '-');
    }

    function escapeRegExp(value) {
        return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function getSelectedVariableOptionValue(options) {
        if (!Array.isArray(options)) {
            return null;
        }
        const selectedOption = options.find(option => option?.selected);
        return normalizeText(selectedOption?.value) ?? normalizeText(selectedOption?.text);
    }

    function getVariableDefaultValue(variable) {
        return normalizeText(variable?.defaultValue)
                ?? getSelectedVariableOptionValue(variable?.options)
                ?? normalizeText(variable?.value);
    }

    function applyDashboardVariableDefaults(query, variables) {
        if (query === undefined || query === null || !Array.isArray(variables) || variables.length === 0) {
            return query ?? '';
        }
        let resolvedQuery = String(query);
        variables.forEach(variable => {
            const name = normalizeText(variable?.name);
            const value = getVariableDefaultValue(variable);
            if (!name || value === null) {
                return;
            }
            const escapedName = escapeRegExp(name);
            resolvedQuery = resolvedQuery
                    .replace(new RegExp('\\$\\{' + escapedName + '(?::[^}]*)?\\}', 'g'), () => value)
                    .replace(new RegExp('\\[\\[' + escapedName + '\\]\\]', 'g'), () => value)
                    .replace(new RegExp('\\$' + escapedName + '(?=$|[^A-Za-z0-9_])', 'g'), () => value);
        });
        return resolvedQuery;
    }

    function normalizeDashboard(item) {
        const dashboard = {...(item || {})};
        dashboard.variables = Array.isArray(dashboard.variables)
                ? dashboard.variables.map(variable => ({...(variable || {})}))
                : [];
        dashboard.panels = Array.isArray(dashboard.panels)
                ? dashboard.panels.map(panel => {
                    const normalizedPanel = {...(panel || {})};
                    normalizedPanel.query = applyDashboardVariableDefaults(normalizedPanel.query, dashboard.variables);
                    return normalizedPanel;
                })
                : [];
        return dashboard;
    }

    function getDashboardUid(dashboard) {
        return normalizeText(dashboard?.uid) ?? '';
    }

    function getDashboardSlug(dashboard) {
        return normalizeText(dashboard?.slug) ?? getDashboardUid(dashboard);
    }

    function getDashboardTitle(dashboard) {
        return normalizeText(dashboard?.title)
                ?? normalizeText(dashboard?.slug)
                ?? normalizeText(dashboard?.uid)
                ?? 'Без названия';
    }

    function getPanelTitle(panel) {
        return normalizeText(panel?.title)
                ?? (panel?.panelId != null ? `График ${panel.panelId}` : 'Без названия');
    }

    function setDashboardFilterMenuOpen(open) {
        if (!dashboardFilterToggle || !dashboardFilterMenu) {
            return;
        }
        dashboardFilterToggle.classList.toggle('show', open);
        dashboardFilterToggle.setAttribute('aria-expanded', String(open));
        dashboardFilterMenu.classList.toggle('show', open);
        if (open) {
            dashboardFilterMenu.setAttribute('data-bs-popper', 'static');
        } else {
            dashboardFilterMenu.removeAttribute('data-bs-popper');
        }
    }

    function initializeDashboardDropdown() {
        if (!dashboardFilterToggle || !dashboardFilterMenu || !dashboardFilterDropdown) {
            return;
        }
        dashboardFilterToggle.addEventListener('click', event => {
            event.preventDefault();
            event.stopPropagation();
            setDashboardFilterMenuOpen(!dashboardFilterMenu.classList.contains('show'));
        });
        dashboardFilterMenu.addEventListener('click', event => {
            event.stopPropagation();
        });
        document.addEventListener('click', event => {
            if (!dashboardFilterDropdown.contains(event.target)) {
                setDashboardFilterMenuOpen(false);
            }
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                setDashboardFilterMenuOpen(false);
            }
        });
    }

    function hideFallbackTooltip() {
        if (!activeFallbackTooltip) {
            return;
        }
        activeFallbackTooltip.remove();
        activeFallbackTooltip = null;
    }

    function positionFallbackTooltip(tooltip, target) {
        const rect = target.getBoundingClientRect();
        const tooltipRect = tooltip.getBoundingClientRect();
        const gap = 8;
        let top = rect.top + window.scrollY - tooltipRect.height - gap;
        if (top < window.scrollY) {
            top = rect.bottom + window.scrollY + gap;
        }
        const left = Math.min(
                Math.max(rect.left + window.scrollX + rect.width / 2 - tooltipRect.width / 2, window.scrollX + gap),
                window.scrollX + document.documentElement.clientWidth - tooltipRect.width - gap);
        tooltip.style.top = `${top}px`;
        tooltip.style.left = `${left}px`;
    }

    function showFallbackTooltip(target) {
        const title = normalizeText(target.getAttribute('data-bs-title'));
        if (!title) {
            return;
        }
        hideFallbackTooltip();
        const tooltip = document.createElement('div');
        tooltip.className = 'tooltip bs-tooltip-auto fade show grafana-dashboard-fallback-tooltip';
        tooltip.setAttribute('role', 'tooltip');

        const arrow = document.createElement('div');
        arrow.className = 'tooltip-arrow';
        const inner = document.createElement('div');
        inner.className = 'tooltip-inner';
        inner.textContent = title;
        tooltip.appendChild(arrow);
        tooltip.appendChild(inner);
        document.body.appendChild(tooltip);
        positionFallbackTooltip(tooltip, target);
        activeFallbackTooltip = tooltip;
    }

    function initializeFallbackTooltip(element) {
        if (element.dataset.fallbackTooltipReady === 'true') {
            return;
        }
        element.dataset.fallbackTooltipReady = 'true';
        element.addEventListener('mouseenter', () => showFallbackTooltip(element));
        element.addEventListener('mouseleave', hideFallbackTooltip);
        element.addEventListener('focus', () => showFallbackTooltip(element));
        element.addEventListener('blur', hideFallbackTooltip);
    }

    function disposeTooltips(root) {
        if (!window.bootstrap?.Tooltip) {
            hideFallbackTooltip();
            return;
        }
        root.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(element => {
            const tooltip = bootstrap.Tooltip.getInstance(element);
            if (tooltip) {
                tooltip.dispose();
            }
        });
        hideFallbackTooltip();
    }

    function initializeTooltips(root) {
        root.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(element => {
            if (!window.bootstrap?.Tooltip) {
                initializeFallbackTooltip(element);
                return;
            }
            if (!bootstrap.Tooltip.getInstance(element)) {
                new bootstrap.Tooltip(element, {
                    boundary: 'window',
                    container: 'body',
                    trigger: 'hover focus'
                });
            }
        });
    }

    function clearDashboardTableBody() {
        disposeTooltips(dashboardsTableBody);
        dashboardsTableBody.innerHTML = '';
    }

    function setTableMessage(message) {
        clearDashboardTableBody();
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = DASHBOARD_TABLE_COLSPAN;
        cell.className = 'text-muted small py-3';
        cell.textContent = message;
        row.appendChild(cell);
        dashboardsTableBody.appendChild(row);
    }

    function updateDashboardFilterLabel() {
        if (!dashboardFilterLabel) {
            return;
        }
        const selectedCount = dashboardFilterSelection.size;
        if (selectedCount === 0) {
            dashboardFilterLabel.textContent = 'Дашборд';
            return;
        }
        if (selectedCount === 1) {
            const selectedUid = Array.from(dashboardFilterSelection)[0];
            const dashboard = dashboardsState.find(item => getDashboardUid(item) === selectedUid);
            dashboardFilterLabel.textContent = getDashboardTitle(dashboard);
            return;
        }
        dashboardFilterLabel.textContent = `Дашборд: ${selectedCount}`;
    }

    function renderDashboardFilterOptions() {
        dashboardFilterList.innerHTML = '';
        const availableUids = new Set(dashboardsState.map(getDashboardUid).filter(Boolean));
        dashboardFilterSelection = new Set(
                Array.from(dashboardFilterSelection).filter(uid => availableUids.has(uid)));

        if (dashboardsState.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'text-muted small';
            empty.textContent = 'Дашборды не загружены.';
            dashboardFilterList.appendChild(empty);
            updateDashboardFilterLabel();
            return;
        }

        dashboardsState.forEach(dashboard => {
            const uid = getDashboardUid(dashboard);
            if (!uid) {
                return;
            }
            const optionId = `dashboard-filter-${sanitizeId(uid)}`;
            const wrapper = document.createElement('label');
            wrapper.className = 'form-check filter-option-check';
            wrapper.setAttribute('for', optionId);

            const input = document.createElement('input');
            input.type = 'checkbox';
            input.className = 'form-check-input';
            input.id = optionId;
            input.value = uid;
            input.checked = dashboardFilterSelection.has(uid);
            input.addEventListener('change', () => {
                if (input.checked) {
                    dashboardFilterSelection.add(uid);
                } else {
                    dashboardFilterSelection.delete(uid);
                }
                updateDashboardFilterLabel();
                renderDashboardTable();
            });

            const title = document.createElement('span');
            title.className = 'form-check-label';
            title.textContent = getDashboardTitle(dashboard);
            wrapper.appendChild(input);
            wrapper.appendChild(title);
            dashboardFilterList.appendChild(wrapper);
        });

        updateDashboardFilterLabel();
    }

    function dashboardMatchesFilters(dashboard, panel) {
        const dashboardUid = getDashboardUid(dashboard);
        const dashboardMatches = dashboardFilterSelection.size === 0 || dashboardFilterSelection.has(dashboardUid);
        if (!dashboardMatches) {
            return false;
        }
        const panelFilter = normalizeText(panelTitleFilterInput?.value)?.toLowerCase();
        if (!panelFilter) {
            return true;
        }
        return getPanelTitle(panel).toLowerCase().includes(panelFilter);
    }

    function renderDashboards(items) {
        dashboardsState = Array.isArray(items) ? items.map(normalizeDashboard) : [];
        renderDashboardFilterOptions();
        renderDashboardTable();
    }

    function renderDashboardTable() {
        clearDashboardTableBody();
        if (dashboardsState.length === 0) {
            setTableMessage('Нажмите «Запросить данные по дашбордам», чтобы подтянуть их из Grafana.');
            return;
        }

        let renderedRows = 0;
        dashboardsState.forEach(dashboard => {
            const panels = Array.isArray(dashboard.panels) ? dashboard.panels : [];
            panels.forEach(panel => {
                if (!dashboardMatchesFilters(dashboard, panel)) {
                    return;
                }
                dashboardsTableBody.appendChild(buildDashboardPanelRow(dashboard, panel));
                renderedRows += 1;
            });
        });

        if (renderedRows === 0) {
            setTableMessage('По выбранным фильтрам графики не найдены.');
        } else {
            initializeTooltips(dashboardsTableBody);
        }
    }

    function buildTextBlock(primaryText, secondaryText, tooltipText = null) {
        const wrapper = document.createElement('div');
        wrapper.className = 'grafana-dashboard-cell-stack';
        const primary = document.createElement('div');
        primary.className = 'grafana-dashboard-primary';
        primary.textContent = primaryText;
        const normalizedTooltip = normalizeText(tooltipText);
        if (normalizedTooltip) {
            primary.setAttribute('data-bs-toggle', 'tooltip');
            primary.setAttribute('data-bs-title', normalizedTooltip);
        }
        wrapper.appendChild(primary);
        if (secondaryText) {
            const secondary = document.createElement('div');
            secondary.className = 'grafana-dashboard-secondary';
            secondary.textContent = secondaryText;
            wrapper.appendChild(secondary);
        }
        return wrapper;
    }

    function buildDashboardPanelRow(dashboard, panel) {
        const row = document.createElement('tr');
        row.dataset.dashboardUid = getDashboardUid(dashboard);
        row.dataset.dashboardSlug = getDashboardSlug(dashboard);
        row.dataset.panelId = panel.panelId ?? '';

        const dashboardCell = document.createElement('td');
        dashboardCell.appendChild(buildTextBlock(getDashboardTitle(dashboard), null));

        const nameCell = document.createElement('td');
        const panelTitle = getPanelTitle(panel);
        nameCell.appendChild(buildTextBlock(panelTitle, null, panelTitle));

        const idCell = document.createElement('td');
        idCell.className = 'grafana-dashboard-panel-id';
        idCell.textContent = panel.panelId ?? '—';

        const queryCell = document.createElement('td');
        queryCell.className = 'grafana-dashboard-query-cell';
        const query = normalizeText(panel.query);
        queryCell.appendChild(buildTextBlock(query || '—', null, query));

        const thresholdCell = document.createElement('td');
        thresholdCell.className = 'grafana-dashboard-threshold-cell';
        const threshold = panel.threshold === null || panel.threshold === undefined || panel.threshold === ''
                ? ''
                : String(panel.threshold);
        thresholdCell.appendChild(buildTextBlock(threshold || '—', null, threshold));

        row.appendChild(dashboardCell);
        row.appendChild(nameCell);
        row.appendChild(idCell);
        row.appendChild(queryCell);
        row.appendChild(thresholdCell);
        return row;
    }

    async function loadDashboards(endpoint, pendingMessage, successMessage) {
        setDashboardsStatus(pendingMessage);
        try {
            const response = await fetch(endpoint);
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            const data = await response.json();
            renderDashboards(data);
            if (successMessage) {
                setDashboardsStatus(successMessage, 'success');
            } else {
                clearDashboardsStatus();
            }
        } catch (error) {
            if (dashboardsState.length === 0) {
                setTableMessage('Не удалось получить дашборды.');
            }
            setDashboardsStatus('Не удалось получить дашборды: ' + error.message, 'danger');
        }
    }

    function collectDashboardPayload(dashboard) {
        const uid = getDashboardUid(dashboard);
        const slug = getDashboardSlug(dashboard);
        const panelSettings = (Array.isArray(dashboard.panels) ? dashboard.panels : [])
                .map(panel => {
                    const panelId = Number.parseInt(panel?.panelId, 10);
                    if (!Number.isFinite(panelId)) {
                        return null;
                    }
                    return {
                        panelId,
                        selected: true,
                        testQuery: Boolean(panel.testQuery)
                    };
                })
                .filter(Boolean);
        const variables = (Array.isArray(dashboard.variables) ? dashboard.variables : [])
                .map(variable => ({
                    name: variable?.name,
                    value: variable?.value ?? variable?.defaultValue ?? ''
                }))
                .filter(variable => normalizeText(variable.name));
        const panels = panelSettings
                .map(panel => panel.panelId)
                .filter(Number.isFinite);
        return { uid, slug, panels, panelSettings, variables };
    }

    async function saveDashboardState(dashboard) {
        const payload = collectDashboardPayload(dashboard);
        if (!payload.uid || !payload.slug) {
            throw new Error('Нет данных о дашборде.');
        }

        const response = await fetch(`/api/settings/grafana-dashboards/${encodeURIComponent(payload.uid)}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                slug: payload.slug,
                panels: payload.panels,
                enabled: dashboard.enabled !== false,
                panelSettings: payload.panelSettings,
                variables: payload.variables
            })
        });
        if (!response.ok) {
            throw new Error('Ответ сервера: ' + response.status);
        }
    }

    async function saveAllDashboards() {
        if (dashboardsState.length === 0) {
            setDashboardsStatus('Нет дашбордов для сохранения.', 'warning');
            return;
        }
        saveDashboardsButton.disabled = true;
        saveDashboardsButton.textContent = 'Сохраняем…';
        try {
            for (const dashboard of dashboardsState) {
                await saveDashboardState(dashboard);
            }
            setDashboardsStatus('Настройки графиков и требований сохранены.', 'success');
        } catch (error) {
            setDashboardsStatus('Не удалось сохранить настройки: ' + error.message, 'danger');
        } finally {
            saveDashboardsButton.disabled = false;
            saveDashboardsButton.textContent = 'Сохранить';
        }
    }

    async function loadCachedDashboards() {
        await loadDashboards(
                '/api/settings/grafana-dashboards',
                'Загружаем сохраненные дашборды…',
                '');
    }

    async function refreshDashboardsFromGrafana() {
        await loadDashboards(
                '/api/settings/grafana-dashboards/discover',
                'Запрашиваем данные из Grafana…',
                'Данные по дашбордам обновлены.');
    }

    fetchDashboardsButton.addEventListener('click', refreshDashboardsFromGrafana);
    saveDashboardsButton.addEventListener('click', saveAllDashboards);
    panelTitleFilterInput.addEventListener('input', renderDashboardTable);
    resetDashboardFiltersButton.addEventListener('click', () => {
        dashboardFilterSelection.clear();
        panelTitleFilterInput.value = '';
        renderDashboardFilterOptions();
        renderDashboardTable();
    });

    initializeDashboardDropdown();
    initializeTooltips(document);

    if (typeof startBackgroundErrorPolling === 'function') {
        startBackgroundErrorPolling(showToast);
    }

    loadCachedDashboards();
</script>
<script src="/js/sidebar-collapse.js?v=perfhub-10"></script>
</body>
