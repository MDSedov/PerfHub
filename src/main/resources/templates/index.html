<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Летописец — Нагрузочные тесты</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
    <style>
        body {
            background-color: #f5fff9;
            font-family: "SF Pro Display", "Roboto", "Segoe UI", sans-serif;
        }

        .navbar-sber {
            background: linear-gradient(90deg, #009846, #2cd67b);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(0, 132, 82, 0.3);
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #ffffff !important;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
        }

        .brand-logo {
            height: 42px;
            width: auto;
            border-radius: 14px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        .main-menu .nav-link {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            border-radius: 999px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .main-menu .nav-link.active,
        .main-menu .nav-link:hover,
        .main-menu .nav-link:focus-visible {
            background-color: #ffffff;
            color: #009846;
        }

        .main-menu .dropdown-toggle::after {
            margin-left: 0.35rem;
        }

        .dropdown-menu {
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 152, 70, 0.25);
            padding: 0.5rem;
            min-width: 16rem;
            max-width: min(22rem, calc(100vw - 1.5rem));
            left: auto;
            right: 0;
        }

        .dropdown-item {
            border-radius: 12px;
            padding: 0.5rem 0.9rem;
            font-weight: 500;
            color: #0b6b3c;
        }

        .dropdown-item.active,
        .dropdown-item:focus,
        .dropdown-item:hover {
            background-color: rgba(0, 152, 70, 0.12);
            color: #009846;
        }

        @media (min-width: 992px) {
            .nav-item.dropdown:hover .dropdown-menu {
                display: block;
                margin-top: 0;
            }
        }

        .tests-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 16px 50px rgba(3, 76, 45, 0.08);
            width: 100%;
        }

        .tests-header,
        .test-row {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1.2fr 0.9fr 1fr auto;
            gap: 1rem;
            align-items: center;
        }

        .tests-header {
            text-transform: uppercase;
            font-size: 0.78rem;
            color: #6a7c73;
            letter-spacing: 0.05em;
            border-bottom: 1px solid rgba(0, 152, 70, 0.15);
            padding-bottom: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .tests-list .list-group-item {
            border: none;
            border-bottom: 1px solid rgba(0, 152, 70, 0.07);
            padding: 1rem 0;
        }

        .tests-list .list-group-item:last-child {
            border-bottom: none;
        }

        .test-type {
            font-weight: 600;
            color: #0b6b3c;
            text-transform: uppercase;
        }

        .test-time {
            font-variant-numeric: tabular-nums;
            color: #1d2822;
        }

        .test-duration {
            color: #4b5d54;
            font-weight: 600;
        }

        .test-status {
            font-weight: 600;
        }

        .progress {
            height: 12px;
            background-color: rgba(0, 152, 70, 0.15);
        }

        .progress-bar {
            background-color: #00b960;
        }

        .test-expand-toggle {
            border: none;
            background-color: rgba(0, 152, 70, 0.12);
            color: #009846;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .test-expand-toggle:hover,
        .test-expand-toggle:focus-visible {
            background-color: rgba(0, 152, 70, 0.2);
            outline: none;
        }

        .test-expand-icon {
            font-size: 1.1rem;
            transition: transform 0.2s ease;
        }

        .test-expand-toggle[aria-expanded="true"] .test-expand-icon {
            transform: rotate(90deg);
        }

        .test-details {
            display: none;
            margin-top: 1rem;
            border-top: 1px solid rgba(0, 152, 70, 0.1);
            padding-top: 1.25rem;
        }

        .test-details.show {
            display: block;
        }

        .requirement-code {
            font-weight: 600;
            color: #0b6b3c;
        }

        .requirement-meta {
            font-size: 0.85rem;
            color: #4b5d54;
        }

        .grafana-panel {
            border: 1px solid rgba(0, 152, 70, 0.15);
            border-radius: 14px;
            padding: 0.9rem;
            margin-bottom: 0;
            background-color: #ffffff;
            height: 100%;
        }

        .grafana-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .grafana-grid-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
        }

        .grafana-grid-row > .grafana-panel:only-child {
            grid-column: span 2;
        }

        .grafana-panel-title {
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .grafana-panel-image {
            width: 100%;
            border-radius: 8px;
            border: 1px solid rgba(0, 152, 70, 0.2);
        }
        
        .grafana-progress .progress {
            height: 10px;
            min-width: 160px;
        }

        .test-details section + section {
            margin-top: 2rem;
        }

        .requirements-table table th {
            text-transform: uppercase;
            font-size: 0.75rem;
            color: #6a7c73;
            letter-spacing: 0.04em;
        }

        .requirements-table table td {
            vertical-align: middle;
        }

        .requirements-table .requirement-desc {
            max-width: 360px;
        }

        @media (max-width: 992px) {
            .tests-header,
            .test-row {
                grid-template-columns: 1fr 1fr;
            }

            .grafana-grid-row {
                grid-template-columns: 1fr;
            }

            .grafana-grid-row > .grafana-panel:only-child {
                grid-column: span 1;
            }

            .test-row span:last-child,
            .tests-header span:last-child {
                justify-self: end;
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-sber">
    <div class="container-fluid align-items-center">
        <a class="navbar-brand text-decoration-none" th:href="@{/tests}">
            <img src="/img/chronicler-logo.png" alt="Летописец" class="brand-logo" loading="lazy">
            <span>Летописец</span>
        </a>
        <ul class="nav main-menu ms-3">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/tests}" th:classappend="${activePage} == 'tests' ? ' active' : ''">Тесты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/reports}" th:classappend="${activePage} == 'reports' ? ' active' : ''">Отчеты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/configuration}" th:classappend="${activePage} == 'configuration' ? ' active' : ''">Конфигурация</a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle"
                   href="#"
                   id="settingsMenu"
                   role="button"
                   data-bs-toggle="dropdown"
                   aria-expanded="false"
                   th:classappend="${activePage} == 'settings' ? ' active' : ''">
                    Настройки
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="settingsMenu">
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/connections}"
                           th:classappend="${activeSettingsSection} == 'connections' ? ' active' : ''">
                            Подключения
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/templates}"
                           th:classappend="${activeSettingsSection} == 'templates' ? ' active' : ''">
                            Шаблоны отчетов
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/grafana-dashboards}"
                           th:classappend="${activeSettingsSection} == 'grafana-dashboards' ? ' active' : ''">
                            Графики, запросы, требования
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<main class="container-fluid py-5 px-3 px-lg-5">
    <div class="mb-4">
        <p class="lead mb-2">Данные по всем нагрузочным тестам за последние 30 дней.</p>
        <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
            <button type="button" class="btn btn-success" id="refreshTestsButton">Запросить данные из Victoria Metrics</button>
            <button type="button" class="btn btn-success" id="evaluateTestsButton">Проверить тесты на требования</button>
        </div>
        <div id="progressContainer" class="mb-3 d-none">
            <p class="text-muted mb-3" id="progressDescription"></p>
            <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="30">
                <div class="progress-bar" id="refreshProgressBar" style="width: 0%" aria-valuenow="0"></div>
            </div>
        </div>
        <div id="evaluationProgressContainer" class="mb-3 d-none">
            <p class="text-muted mb-3" id="evaluationProgressDescription"></p>
            <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="0">
                <div class="progress-bar" id="evaluationProgressBar" style="width: 0%" aria-valuenow="0"></div>
            </div>
        </div>
        <div id="refreshStatus" class="alert d-none mb-0 py-2 px-3" role="alert"></div>
    </div>

    <div class="card tests-card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title mb-0">Нагрузочные тесты</h5>
                <span id="testsCount" class="badge bg-secondary">0</span>
            </div>
            <div id="testsStatus" class="alert alert-info d-none" role="alert"></div>
            <div class="tests-header">
                <span>Тип</span>
                <span>Начало</span>
                <span>Конец</span>
                <span>Длительность</span>
                <span>Соответствие</span>
                <span class="text-end">Детали</span>
            </div>
            <div id="testsList" class="list-group tests-list"></div>
        </div>
    </div>
</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9K/Y/xFd25tOfvtTDHkJ/xZBfX0Ax7Anxr1Lk0XG"
        crossorigin="anonymous"></script>
<script>
    const testsList = document.getElementById('testsList');
    const testsStatus = document.getElementById('testsStatus');
    const testsCount = document.getElementById('testsCount');
    const refreshButton = document.getElementById('refreshTestsButton');
    const evaluateTestsButton = document.getElementById('evaluateTestsButton');
    const refreshStatus = document.getElementById('refreshStatus');
    const refreshProgressBar = document.getElementById('refreshProgressBar');
    const progressDescription = document.getElementById('progressDescription');
    const progressContainer = document.getElementById('progressContainer');
    const evaluationProgressContainer = document.getElementById('evaluationProgressContainer');
    const evaluationProgressDescription = document.getElementById('evaluationProgressDescription');
    const evaluationProgressBar = document.getElementById('evaluationProgressBar');

    const MOSCOW_TZ = 'Europe/Moscow';
    const DAYS_TO_FETCH = 30;
    const MS_IN_DAY = 24 * 60 * 60 * 1000;
    const MOSCOW_FORMATTER = new Intl.DateTimeFormat('sv-SE', {
        timeZone: MOSCOW_TZ,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });

    const TYPE_LABELS = {
        max: 'MAX',
        confirm: 'CONFIRM',
        soak: 'SOAK',
        unknown: 'UNKNOWN'
    };

    const NO_CONFIG_MESSAGE = 'Конфигурация DroApp для данного теста отсутствует';

    const REQUIREMENT_STATUS_LABELS = {
        PASS: 'Соответствует',
        FAIL: 'Не соответствует',
        NOT_APPLICABLE: 'Н/Д',
        ERROR: 'Ошибка'
    };

    const REQUIREMENT_STATUS_CLASS = {
        PASS: 'badge bg-success',
        FAIL: 'badge bg-danger',
        NOT_APPLICABLE: 'badge bg-secondary',
        ERROR: 'badge bg-warning text-dark'
    };

    let isRefreshing = false;
    let evaluationsAllowed = true;
    let isEvaluationInProgress = false;
    const evaluationCache = new Map();
    const evaluationRequests = new Map();
    const grafanaPanelsCache = new Map();
    const grafanaPanelRequests = new Map();
    const testConfigurationCache = new Map();
    const testConfigurationRequests = new Map();
    const activeStatusControllers = new Map();
    const testStatusElements = new Map();

    function formatInMoscow(date) {
        return MOSCOW_FORMATTER.format(date);
    }

    function setTestsStatus(message, type = 'info') {
        testsStatus.textContent = message;
        testsStatus.className = `alert alert-${type}`;
        testsStatus.classList.remove('d-none');
    }

    function clearTestsStatus() {
        testsStatus.classList.add('d-none');
    }

    function parseMoscowDate(value) {
        if (!value) {
            return null;
        }
        return new Date(value.replace(' ', 'T') + '+03:00');
    }

    function formatDuration(start, end) {
        const startDate = parseMoscowDate(start);
        const endDate = parseMoscowDate(end);
        if (!startDate || !endDate || endDate <= startDate) {
            return '—';
        }
        const diffMs = endDate - startDate;
        const totalMinutes = Math.floor(diffMs / 60000);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        if (hours === 0) {
            return `${minutes} мин`;
        }
        return `${hours} ч ${minutes.toString().padStart(2, '0')} мин`;
    }

    function setProgress(completed) {
        const percent = Math.min(100, Math.round((completed / DAYS_TO_FETCH) * 100));
        refreshProgressBar.style.width = `${percent}%`;
        refreshProgressBar.setAttribute('aria-valuenow', completed.toString());
    }

    function updateProgressMessage(completed) {
        progressDescription.textContent =
                `Запрашиваем данные по тестам из Victoria Metrics. Получены данные за ${completed} из ${DAYS_TO_FETCH} дней.`;
    }

    function showProgressUI() {
        if (!progressContainer) {
            return;
        }
        progressContainer.classList.remove('d-none');
        setProgress(0);
        updateProgressMessage(0);
    }

    function hideProgressUI() {
        if (!progressContainer) {
            return;
        }
        progressContainer.classList.add('d-none');
    }

    function showEvaluationProgress(total) {
        if (!evaluationProgressContainer) {
            return;
        }
        evaluationProgressContainer.classList.remove('d-none');
        evaluationProgressBar.setAttribute('aria-valuemax', total.toString());
        evaluationProgressBar.setAttribute('aria-valuemin', '0');
        evaluationProgressBar.style.width = '0%';
        evaluationProgressBar.setAttribute('aria-valuenow', '0');
        evaluationProgressDescription.textContent =
                `Перепроверяем тесты на соответствие нефункциональным требованиям. Проверено 0 из ${total} тестов.`;
    }

    function updateEvaluationProgress(current, total) {
        if (!evaluationProgressContainer) {
            return;
        }
        const percent = total === 0 ? 0 : Math.round((current / total) * 100);
        evaluationProgressBar.style.width = `${percent}%`;
        evaluationProgressBar.setAttribute('aria-valuenow', current.toString());
        evaluationProgressDescription.textContent =
                `Перепроверяем тесты на соответствие нефункциональным требованиям. Проверено ${current} из ${total} тестов.`;
    }

    function hideEvaluationProgress() {
        if (!evaluationProgressContainer) {
            return;
        }
        evaluationProgressContainer.classList.add('d-none');
    }

    function setRefreshStatus(message, type = 'info') {
        refreshStatus.textContent = message;
        refreshStatus.className = `alert alert-${type} mb-0 py-2 px-3`;
        refreshStatus.classList.remove('d-none');
    }

    function clearRefreshStatus() {
        refreshStatus.classList.add('d-none');
    }

    function resetTestStatusRequests() {
        activeStatusControllers.forEach(controller => controller.abort());
        activeStatusControllers.clear();
    }

    function updateEvaluateButtonState() {
        if (!evaluateTestsButton) {
            return;
        }
        const hasTests = testStatusElements.size > 0;
        evaluateTestsButton.disabled =
                isRefreshing || !evaluationsAllowed || !hasTests || isEvaluationInProgress;
    }

    async function loadTests(showLoading = true) {
        if (showLoading) {
            setTestsStatus('Загружаем тесты…', 'info');
        }
        try {
            const response = await fetch('/api/tests');
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            const tests = await response.json();
            renderTests(Array.isArray(tests) ? tests : []);
            clearTestsStatus();
            return true;
        } catch (error) {
        setTestsStatus('Не удалось получить список тестов: ' + error.message, 'danger');
        updateEvaluateButtonState();
        return false;
    }
    }

    function setTestStatusView(element, state) {
        element.className = 'test-status';
        switch (state) {
            case 'loading':
                element.textContent = 'Проверка…';
                element.classList.add('text-muted');
                break;
            case 'pass':
                element.textContent = 'Соответствует';
                element.classList.add('text-success');
                break;
            case 'fail':
                element.textContent = 'Не соответствует';
                element.classList.add('text-danger');
                break;
            case 'missing':
                element.textContent = 'Нет данных';
                element.classList.add('text-muted');
                break;
            default:
                element.textContent = 'Ошибка';
                element.classList.add('text-warning');
        }
    }

    function setPendingStatus(element) {
        element.className = 'test-status text-muted';
        element.textContent = 'Ожидает обновления';
    }

    function setCheckingStatus(element) {
        element.className = 'test-status text-muted';
        element.textContent = 'Проверка…';
    }

    function markStatusesChecking() {
        testStatusElements.forEach(setCheckingStatus);
    }

    function markAllStatusesPending() {
        testStatusElements.forEach(setPendingStatus);
    }

    async function fetchEvaluation(testId, mode = 'cached') {
        const endpoint = mode === 'fresh' ? '/api/requirements/evaluate' : '/api/requirements/status';
        const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ testUuid: testId })
        });
        if (!response.ok) {
            throw new Error('Ответ сервера: ' + response.status);
        }
        return await response.json();
    }

    function ensureEvaluation(testId, mode = 'cached') {
        if (mode === 'cached' && evaluationCache.has(testId)) {
            return Promise.resolve(evaluationCache.get(testId));
        }
        const requestKey = `${testId}:${mode}`;
        if (!evaluationRequests.has(requestKey)) {
            const request = fetchEvaluation(testId, mode)
                    .then(payload => {
                        evaluationCache.set(testId, payload);
                        return payload;
                    })
                    .finally(() => {
                        evaluationRequests.delete(requestKey);
                    });
            evaluationRequests.set(requestKey, request);
        }
        return evaluationRequests.get(requestKey);
    }

    async function fetchTestConfiguration(testId) {
        const response = await fetch(`/api/tests/${testId}/configuration`);
        if (!response.ok) {
            throw new Error('Ответ сервера: ' + response.status);
        }
        return await response.json();
    }

    function ensureTestConfiguration(testId) {
        if (testConfigurationCache.has(testId)) {
            return Promise.resolve(testConfigurationCache.get(testId));
        }
        if (!testConfigurationRequests.has(testId)) {
            const request = fetchTestConfiguration(testId)
                    .then(payload => {
                        const items = Array.isArray(payload) ? payload : [];
                        testConfigurationCache.set(testId, items);
                        return items;
                    })
                    .finally(() => {
                        testConfigurationRequests.delete(testId);
                    });
            testConfigurationRequests.set(testId, request);
        }
        return testConfigurationRequests.get(testId);
    }

    async function evaluateTestStatus(testId, statusElement, mode = 'cached') {
        try {
            activeStatusControllers.get(testId)?.abort();
            const controller = new AbortController();
            activeStatusControllers.set(testId, controller);
            setTestStatusView(statusElement, 'loading');
            const evaluation = await ensureEvaluation(testId, mode);
            if (controller.signal.aborted) {
                return;
            }
            const compliant = Boolean(evaluation?.compliant);
            setTestStatusView(statusElement, compliant ? 'pass' : 'fail');
        } catch (error) {
            if (error.name === 'AbortError') {
                return;
            }
            setTestStatusView(statusElement, 'error');
        } finally {
            activeStatusControllers.delete(testId);
        }
    }

    async function fetchGrafanaPanels(testId) {
        const response = await fetch('/api/grafana/panels/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ testUuid: testId })
        });
        if (!response.ok) {
            throw new Error('Ответ сервера: ' + response.status);
        }
        const payload = await response.json();
        const panels = flattenGrafanaPanels(payload);
        grafanaPanelsCache.set(testId, panels);
        return panels;
    }

    function ensureGrafanaPanels(testId) {
        if (grafanaPanelsCache.has(testId)) {
            return Promise.resolve(grafanaPanelsCache.get(testId));
        }
        if (!grafanaPanelRequests.has(testId)) {
            grafanaPanelRequests.set(testId, fetchGrafanaPanels(testId).finally(() => {
                grafanaPanelRequests.delete(testId);
            }));
        }
        return grafanaPanelRequests.get(testId);
    }

    function flattenGrafanaPanels(response) {
        if (!response || !Array.isArray(response.dashboards)) {
            return [];
        }
        const panels = [];
        response.dashboards.forEach(dashboard => {
            if (!dashboard || !Array.isArray(dashboard.panels)) {
                return;
            }
            dashboard.panels.forEach(panel => {
                if (panel) {
                    panels.push(panel);
                }
            });
        });
        return panels;
    }

    function createGrafanaProgress(message = 'Загружаем графики…') {
        const wrapper = document.createElement('div');
        wrapper.className = 'grafana-progress d-flex align-items-center gap-3 mb-2';

        const label = document.createElement('div');
        label.className = 'text-muted small mb-0 flex-shrink-0';
        label.textContent = message;

        const progress = document.createElement('div');
        progress.className = 'progress flex-grow-1';
        const bar = document.createElement('div');
        bar.className = 'progress-bar progress-bar-striped progress-bar-animated';
        bar.setAttribute('role', 'progressbar');
        bar.setAttribute('aria-valuemin', '0');
        bar.setAttribute('aria-valuemax', '0');
        bar.setAttribute('aria-valuenow', '0');
        bar.style.width = '0%';
        progress.appendChild(bar);

        wrapper.appendChild(label);
        wrapper.appendChild(progress);
        return { wrapper, bar, label };
    }

    function updateGrafanaProgress(progress, loaded, total) {
        if (!progress?.bar) {
            return;
        }
        const safeTotal = Math.max(total, 0);
        const safeLoaded = Math.min(Math.max(loaded, 0), safeTotal || loaded);
        const percent = safeTotal === 0 ? 0 : Math.round((safeLoaded / safeTotal) * 100);
        progress.bar.style.width = `${percent}%`;
        progress.bar.setAttribute('aria-valuenow', safeLoaded.toString());
        progress.bar.setAttribute('aria-valuemax', safeTotal.toString());
        progress.bar.textContent = safeTotal > 0 ? `${safeLoaded} из ${safeTotal}` : '0 из 0';
        if (progress.label) {
            progress.label.textContent = safeTotal > 0
                    ? `${safeLoaded >= safeTotal ? 'Графики загружены' : 'Загружаем графики'}: ${safeLoaded} из ${safeTotal}`
                    : 'Для этого теста нет графиков';
        }
    }

    function completeGrafanaProgress(progress) {
        if (!progress?.wrapper) {
            return;
        }
        const { wrapper, bar } = progress;
        if (bar) {
            const total = bar.getAttribute('aria-valuemax') ?? '0';
            bar.style.width = '100%';
            bar.setAttribute('aria-valuenow', total === '0' ? '0' : total);
            bar.textContent = total === '0' ? '0 из 0' : `${total} из ${total}`;
            if (progress.label && total !== '0') {
                progress.label.textContent = `Графики загружены: ${total} из ${total}`;
            }
        }
        setTimeout(() => wrapper.classList.add('d-none'), 200);
    }

    function createGrafanaPanelElement(panel, onReady) {
        const wrapper = document.createElement('div');
        wrapper.className = 'grafana-panel';

        const title = document.createElement('div');
        title.className = 'grafana-panel-title';
        title.textContent = panel?.title ?? 'Без названия';
        wrapper.appendChild(title);

        if (panel?.description) {
            const description = document.createElement('div');
            description.className = 'grafana-panel-description text-muted small mb-2';
            description.textContent = panel.description;
            wrapper.appendChild(description);
        }

        if (panel?.imageBase64) {
            const image = document.createElement('img');
            image.className = 'grafana-panel-image';
            image.src = `data:image/png;base64,${panel.imageBase64}`;
            image.alt = panel?.title ? `График ${panel.title}` : 'График';
            const completeHandler = () => {
                image.removeEventListener('load', completeHandler);
                image.removeEventListener('error', completeHandler);
                if (typeof onReady === 'function') {
                    onReady();
                }
            };
            image.addEventListener('load', completeHandler);
            image.addEventListener('error', completeHandler);
            wrapper.appendChild(image);
        } else {
            const placeholder = document.createElement('div');
            placeholder.className = 'text-muted small';
            placeholder.textContent = 'Изображение недоступно.';
            wrapper.appendChild(placeholder);
            if (typeof onReady === 'function') {
                onReady();
            }
        }

        return wrapper;
    }

    function renderRequirementResults(container, evaluation) {
        container.innerHTML = '';
        const requirements = evaluation?.requirements ?? [];
        if (!requirements.length) {
            container.innerHTML = '<div class="text-muted small">Нет проведённых проверок.</div>';
            return;
        }

        const tableWrapper = document.createElement('div');
        tableWrapper.className = 'requirements-table table-responsive';
        const table = document.createElement('table');
        table.className = 'table table-sm align-middle mb-0';
        table.innerHTML = `
            <thead>
                <tr>
                    <th scope="col">Название графика</th>
                    <th scope="col">Порог</th>
                    <th scope="col">Факт</th>
                    <th scope="col">Статус</th>
                </tr>
            </thead>
            <tbody></tbody>
        `;
        const tbody = table.querySelector('tbody');

        requirements.forEach(requirement => {
            const row = document.createElement('tr');

            const titleCell = document.createElement('td');
            titleCell.className = 'requirement-meta requirement-desc';
            titleCell.textContent = requirement?.title ?? '—';

            const thresholdCell = document.createElement('td');
            const thresholdValue = requirement?.thresholdValue ?? '—';
            const thresholdUnit = requirement?.thresholdUnit ?? '';
            thresholdCell.textContent = `${thresholdValue} ${thresholdUnit}`.trim();

            const measuredCell = document.createElement('td');
            if (typeof requirement?.measuredValue === 'number') {
                const measuredUnit = requirement?.measuredUnit ?? '';
                measuredCell.textContent = `${requirement.measuredValue} ${measuredUnit}`.trim();
            } else {
                measuredCell.textContent = '—';
            }

            const statusCell = document.createElement('td');
            const statusKey = requirement?.status ?? 'ERROR';
            const badge = document.createElement('span');
            badge.className = REQUIREMENT_STATUS_CLASS[statusKey] ?? 'badge bg-secondary';
            badge.textContent = REQUIREMENT_STATUS_LABELS[statusKey] ?? statusKey;
            statusCell.appendChild(badge);

            row.appendChild(titleCell);
            row.appendChild(thresholdCell);
            row.appendChild(measuredCell);
            row.appendChild(statusCell);
            tbody.appendChild(row);
        });

        tableWrapper.appendChild(table);
        container.appendChild(tableWrapper);
    }

    function renderGrafanaPanels(container, panels, onPanelReady) {
        container.innerHTML = '';
        if (!panels || panels.length === 0) {
            container.innerHTML = '<div class="text-muted small">Для этого теста нет графиков.</div>';
            return;
        }
        const grid = document.createElement('div');
        grid.className = 'grafana-grid';
        for (let i = 0; i < panels.length; i += 2) {
            const row = document.createElement('div');
            row.className = 'grafana-grid-row';
            row.appendChild(createGrafanaPanelElement(panels[i], onPanelReady));
            if (panels[i + 1]) {
                row.appendChild(createGrafanaPanelElement(panels[i + 1], onPanelReady));
            }
            grid.appendChild(row);
        }
        container.appendChild(grid);
    }

    function renderConfiguration(container, items) {
        if (!container) {
            return;
        }
        if (!Array.isArray(items) || items.length === 0) {
            container.innerHTML = `<div class="text-muted small">${NO_CONFIG_MESSAGE}</div>`;
            return;
        }
        const table = document.createElement('table');
        table.className = 'table table-sm align-middle mb-0';
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        ['POD', 'Контейнер', 'Версия', 'Request CPU', 'Limit CPU', 'Request RAM', 'Limit RAM']
                .forEach(title => {
                    const th = document.createElement('th');
                    th.scope = 'col';
                    th.textContent = title;
                    headerRow.appendChild(th);
                });
        thead.appendChild(headerRow);
        const tbody = document.createElement('tbody');
        items.forEach(item => {
            const row = document.createElement('tr');
            appendConfigCell(row, item?.podName);
            appendConfigCell(row, item?.containerName);
            appendConfigCell(row, item?.version);
            appendConfigCell(row, item?.requestCpu);
            appendConfigCell(row, item?.limitCpu);
            appendConfigCell(row, item?.requestRam);
            appendConfigCell(row, item?.limitRam);
            tbody.appendChild(row);
        });
        table.appendChild(thead);
        table.appendChild(tbody);
        container.innerHTML = '';
        container.appendChild(table);
    }

    function appendConfigCell(row, value) {
        const cell = document.createElement('td');
        cell.textContent = value ?? '';
        row.appendChild(cell);
    }

    async function loadTestDetails(testId, container) {
        container.dataset.loading = 'true';
        container.innerHTML = '';
        const wrapper = document.createElement('div');
        container.appendChild(wrapper);

        const requirementsSection = document.createElement('section');
        const requirementsTitle = document.createElement('h6');
        requirementsTitle.className = 'mb-3';
        requirementsTitle.textContent = 'Проверки требований';
        const requirementsBox = document.createElement('div');
        requirementsBox.innerHTML = '<div class="text-muted small">Загружаем результаты проверок…</div>';
        requirementsSection.appendChild(requirementsTitle);
        requirementsSection.appendChild(requirementsBox);

        const configurationSection = document.createElement('section');
        const configurationTitle = document.createElement('h6');
        configurationTitle.className = 'mb-3';
        configurationTitle.textContent = 'Конфигурация DropApp';
        const configurationBox = document.createElement('div');
        configurationBox.innerHTML = '<div class="text-muted small">Загружаем конфигурацию…</div>';
        configurationSection.appendChild(configurationTitle);
        configurationSection.appendChild(configurationBox);

        const grafanaSection = document.createElement('section');
        const grafanaTitle = document.createElement('h6');
        grafanaTitle.className = 'mb-3';
        grafanaTitle.textContent = 'Графики';
        const grafanaProgress = createGrafanaProgress();
        updateGrafanaProgress(grafanaProgress, 0, 0);
        let grafanaPanelsTotal = 0;
        let grafanaPanelsLoaded = 0;
        let grafanaProgressCompleted = false;
        const grafanaBox = document.createElement('div');
        grafanaBox.innerHTML = '<div class="text-muted small">Загружаем графики…</div>';
        grafanaSection.appendChild(grafanaTitle);
        grafanaSection.appendChild(grafanaProgress.wrapper);
        grafanaSection.appendChild(grafanaBox);

        wrapper.appendChild(requirementsSection);
        wrapper.appendChild(configurationSection);
        wrapper.appendChild(grafanaSection);

        if (!evaluationsAllowed) {
            requirementsBox.innerHTML = '<div class="text-muted small">Проверки станут доступны после завершения обновления данных.</div>';
        } else {
            try {
                const evaluation = await ensureEvaluation(testId);
                renderRequirementResults(requirementsBox, evaluation);
            } catch (error) {
                requirementsBox.innerHTML = `<div class="text-danger small">Не удалось получить результаты проверок: ${error.message}</div>`;
            }
        }

        try {
            const configuration = await ensureTestConfiguration(testId);
            renderConfiguration(configurationBox, configuration);
        } catch (error) {
            configurationBox.innerHTML = `<div class="text-danger small">Не удалось загрузить конфигурацию: ${error.message}</div>`;
        }

        try {
            const panels = await ensureGrafanaPanels(testId);
            grafanaPanelsTotal = panels.length;
            updateGrafanaProgress(grafanaProgress, grafanaPanelsLoaded, grafanaPanelsTotal);
            if (grafanaPanelsTotal === 0) {
                completeGrafanaProgress(grafanaProgress);
                grafanaProgressCompleted = true;
            }
            renderGrafanaPanels(grafanaBox, panels, () => {
                grafanaPanelsLoaded += 1;
                updateGrafanaProgress(grafanaProgress, grafanaPanelsLoaded, grafanaPanelsTotal);
                if (!grafanaProgressCompleted && grafanaPanelsLoaded >= grafanaPanelsTotal) {
                    completeGrafanaProgress(grafanaProgress);
                    grafanaProgressCompleted = true;
                }
            });
        } catch (error) {
            grafanaBox.innerHTML = `<div class="text-danger small">Не удалось загрузить графики: ${error.message}</div>`;
        } finally {
            if (!grafanaProgressCompleted) {
                completeGrafanaProgress(grafanaProgress);
            }
        }

        container.dataset.loading = 'false';
        container.dataset.loaded = evaluationsAllowed ? 'true' : 'false';
    }

    function toggleDetails(testId, button, container) {
        const isExpanded = button.getAttribute('aria-expanded') === 'true';
        if (isExpanded) {
            button.setAttribute('aria-expanded', 'false');
            container.classList.remove('show');
            return;
        }
        button.setAttribute('aria-expanded', 'true');
        container.classList.add('show');
        if (container.dataset.loaded === 'true' || container.dataset.loading === 'true') {
            return;
        }
        loadTestDetails(testId, container);
    }

    function renderTests(tests) {
        testsList.innerHTML = '';
        testsCount.textContent = tests.length.toString();
        resetTestStatusRequests();
        evaluationCache.clear();
        evaluationRequests.clear();
        grafanaPanelsCache.clear();
        grafanaPanelRequests.clear();
        testConfigurationCache.clear();
        testConfigurationRequests.clear();

        if (tests.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'text-muted';
            empty.textContent = 'Тесты отсутствуют. Нажмите «Обновить данные», чтобы получить последние результаты.';
            testsList.appendChild(empty);
            updateEvaluateButtonState();
            return;
        }

        testStatusElements.clear();

        tests.forEach(test => {
            const item = document.createElement('div');
            item.className = 'list-group-item';

            const row = document.createElement('div');
            row.className = 'test-row';

            const type = document.createElement('span');
            type.className = 'test-type';
            const normalizedType = (test.type ?? 'unknown').toLowerCase();
            type.textContent = TYPE_LABELS[normalizedType] ?? normalizedType;

            const start = document.createElement('span');
            start.className = 'test-time';
            start.textContent = test.start ?? '—';

            const end = document.createElement('span');
            end.className = 'test-time';
            end.textContent = test.end ?? '—';

            const duration = document.createElement('span');
            duration.className = 'test-duration';
            duration.textContent = formatDuration(test.start, test.end);

            const status = document.createElement('span');
            status.className = 'test-status text-muted';
            status.textContent = '—';
            setPendingStatus(status);
            testStatusElements.set(test.id, status);

            const detailsWrapper = document.createElement('div');
            detailsWrapper.className = 'text-end';
            const toggleButton = document.createElement('button');
            toggleButton.type = 'button';
            toggleButton.className = 'test-expand-toggle';
            toggleButton.setAttribute('aria-expanded', 'false');
            toggleButton.innerHTML = '<span class="test-expand-icon">&rsaquo;</span>';
            detailsWrapper.appendChild(toggleButton);

            row.appendChild(type);
            row.appendChild(start);
            row.appendChild(end);
            row.appendChild(duration);
            row.appendChild(status);
            row.appendChild(detailsWrapper);

            const detailsContainer = document.createElement('div');
            detailsContainer.className = 'test-details';
            detailsContainer.dataset.loaded = 'false';
            detailsContainer.innerHTML = '<div class="text-muted small">Раскройте, чтобы увидеть проверки и графики.</div>';

            toggleButton.addEventListener('click', () => toggleDetails(test.id, toggleButton, detailsContainer));

            item.appendChild(row);
            item.appendChild(detailsContainer);
            testsList.appendChild(item);
        });

        updateEvaluateButtonState();
    }

    async function evaluateAllTests(showProgress = false) {
        if (!evaluationsAllowed || testStatusElements.size === 0 || isEvaluationInProgress) {
            return;
        }
        isEvaluationInProgress = true;
        updateEvaluateButtonState();
        resetTestStatusRequests();
        const evaluationMode = showProgress ? 'fresh' : 'cached';
        if (showProgress) {
            markStatusesChecking();
        }
        let completed = 0;
        let refreshPreviouslyDisabled = refreshButton ? refreshButton.disabled : true;
        if (showProgress && refreshButton) {
            refreshButton.disabled = true;
        }

        if (showProgress) {
            showEvaluationProgress(testStatusElements.size);
            refreshStatus.classList.add('d-none');
        }

        const testEntries = Array.from(testStatusElements.entries());
        try {
            for (const [testId, statusElement] of testEntries) {
                await evaluateTestStatus(testId, statusElement, evaluationMode);
                completed += 1;
                if (showProgress) {
                    updateEvaluationProgress(completed, testEntries.length);
                }
            }
            if (showProgress) {
                setRefreshStatus('Проверка тестов на соответствие НФТ завершена.', 'success');
            }
        } catch (error) {
            if (showProgress) {
                setRefreshStatus('Не удалось завершить проверку: ' + error.message, 'danger');
            }
        } finally {
            if (showProgress) {
                hideEvaluationProgress();
            }
            if (showProgress && refreshButton && !refreshPreviouslyDisabled && !isRefreshing) {
                refreshButton.disabled = false;
            }
            isEvaluationInProgress = false;
            updateEvaluateButtonState();
        }
    }

    function getDayRange(daysAgo) {
        const now = new Date();
        const targetDate = new Date(now.getTime() - daysAgo * MS_IN_DAY);
        const datePart = formatInMoscow(targetDate).split(' ')[0];
        const start = `${datePart} 00:00:00`;
        const end = daysAgo === 0 ? formatInMoscow(now) : `${datePart} 23:59:59`;
        return { start, end, label: datePart };
    }

    async function fetchVictoriaMetricsRange(start, end) {
        const response = await fetch('/api/victoriametrics/tests/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ start, end })
        });
        if (!response.ok) {
            throw new Error('Ответ сервера: ' + response.status);
        }
        await response.json();
    }

    async function refreshLastMonth() {
        if (isRefreshing) {
            return;
        }
        isRefreshing = true;
        evaluationsAllowed = false;
        updateEvaluateButtonState();
        markAllStatusesPending();
        refreshButton.disabled = true;
        clearRefreshStatus();
        showProgressUI();
        let completed = 0;
        let evaluatedAfterRefresh = false;
        try {
            for (let dayOffset = 0; dayOffset < DAYS_TO_FETCH; dayOffset++) {
                const { start, end, label } = getDayRange(dayOffset);
                try {
                    await fetchVictoriaMetricsRange(start, end);
                    completed += 1;
                    updateProgressMessage(completed);
                    setProgress(completed);
                } catch (error) {
                    throw new Error(`День ${label}: ${error.message}`);
                }
            }
            const loaded = await loadTests(false);
            if (!loaded) {
                throw new Error('Не удалось загрузить список тестов после обновления данных.');
            }
            evaluationsAllowed = true;
            updateEvaluateButtonState();
            await evaluateAllTests();
            evaluatedAfterRefresh = true;
            setRefreshStatus('Данные успешно обновлены.', 'success');
        } catch (error) {
            setRefreshStatus(error.message, 'danger');
        } finally {
            isRefreshing = false;
            refreshButton.disabled = false;
            hideProgressUI();
            if (!evaluatedAfterRefresh) {
                evaluationsAllowed = true;
                await evaluateAllTests();
            }
            updateEvaluateButtonState();
        }
    }

    refreshButton.addEventListener('click', () => refreshLastMonth());

    if (evaluateTestsButton) {
        evaluateTestsButton.addEventListener('click', () => {
            if (!evaluateTestsButton.disabled) {
                evaluateAllTests(true);
            }
        });
    }

    (async function init() {
        updateEvaluateButtonState();
        const loaded = await loadTests();
        if (loaded) {
            await evaluateAllTests();
        }
    })();
</script>
