<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PerfHub — Вход</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css?v=perfhub-12">
</head>
<body class="login-page">
<a href="/login" class="login-logo" aria-label="PerfHub">
    <img src="/img/perfhub-logo.png?v=perfhub-4" alt="PerfHub">
</a>

<main class="login-shell">
    <form class="login-form" method="post" action="/login" novalidate>
        <input type="hidden" name="redirect" th:value="${redirect}">
        <h1>Войти в личный кабинет</h1>

        <div th:if="${loginError}" class="alert alert-danger py-2" role="alert" th:text="${loginError}"></div>

        <div class="login-field">
            <input type="text"
                   class="form-control"
                   name="username"
                   autocomplete="username"
                   placeholder="Имя пользователя"
                   th:value="${username}"
                   required
                   autofocus>
        </div>

        <div class="login-field password-field">
            <input type="password"
                   class="form-control"
                   id="loginPasswordInput"
                   name="password"
                   autocomplete="current-password"
                   placeholder="Пароль"
                   required>
            <button type="button"
                    class="password-toggle"
                    id="loginPasswordToggle"
                    aria-label="Показать пароль"
                    title="Показать пароль">
                <i class="bi bi-eye"></i>
            </button>
        </div>

        <button type="submit" class="btn btn-success login-submit">Войти</button>
    </form>
</main>

<script>
    const passwordInput = document.getElementById('loginPasswordInput');
    const passwordToggle = document.getElementById('loginPasswordToggle');

    if (passwordInput && passwordToggle) {
        passwordToggle.addEventListener('click', () => {
            const visible = passwordInput.type === 'text';
            passwordInput.type = visible ? 'password' : 'text';
            passwordToggle.setAttribute('aria-label', visible ? 'Показать пароль' : 'Скрыть пароль');
            passwordToggle.setAttribute('title', visible ? 'Показать пароль' : 'Скрыть пароль');
            passwordToggle.innerHTML = visible ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
        });
    }
</script>
</body>
</html>
