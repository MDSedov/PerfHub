<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Летописец — Отчеты</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
    <style>
        body {
            background-color: #f5fff9;
            font-family: "SF Pro Display", "Roboto", "Segoe UI", sans-serif;
        }

        .navbar-sber {
            background: linear-gradient(90deg, #009846, #2cd67b);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(0, 132, 82, 0.3);
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #ffffff !important;
        }

        .main-menu .nav-link {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            border-radius: 999px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .main-menu .nav-link.active,
        .main-menu .nav-link:hover,
        .main-menu .nav-link:focus-visible {
            background-color: #ffffff;
            color: #009846;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-sber">
    <div class="container-fluid align-items-center">
        <span class="navbar-brand">Летописец</span>
        <ul class="nav main-menu ms-3">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/tests}" th:classappend="${activePage} == 'tests' ? ' active' : ''">Тесты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/reports}" th:classappend="${activePage} == 'reports' ? ' active' : ''">Отчеты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/settings}" th:classappend="${activePage} == 'settings' ? ' active' : ''">Настройки</a>
            </li>
        </ul>
    </div>
</nav>

<main class="container py-5">
    <div class="card border-0 shadow-sm">
        <div class="card-body text-center py-5">
            <h5 class="card-title mb-3">Раздел «Отчеты»</h5>
            <p class="text-muted mb-0">Страница пока пуста. Здесь появится конструктор отчетов.</p>
        </div>
    </div>
</main>
</body>
</html>
