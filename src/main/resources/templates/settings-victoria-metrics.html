<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Летописец — Victoria Metrics</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <a class="sidebar-brand" th:href="@{/}">
            <img src="/img/chronicler-logo.png" alt="Летописец" class="brand-logo" loading="lazy">
            <span>Летописец</span>
        </a>
        <div class="sidebar-menu">
            <a class="sidebar-link" th:href="@{/tests}"
               th:classappend="${activePage} == 'tests' ? ' active' : ''">
                <span class="sidebar-item">
                    <span class="menu-icon"><i class="bi bi-activity"></i></span>
                    <span>Тесты и отчеты</span>
                </span>
            </a>
            <div class="sidebar-submenu" style="margin-bottom: 0.5rem;">
                <a class="sidebar-sublink"
                   id="reportsSubLink"
                   th:href="@{/reports}"
                   th:classappend="${activePage} == 'reports' ? ' active' : ''">
                    <span class="sidebar-item">
                        <span class="menu-icon"><i class="bi bi-journal-text"></i></span>
                        <span>Генерация отчётов</span>
                    </span>
                </a>
            </div>
            <a class="sidebar-link" th:href="@{/settings/grafana-dashboards}"
               th:classappend="${activeSettingsSection} == 'grafana-dashboards' ? ' active' : ''">
                <span class="sidebar-item">
                    <span class="menu-icon"><i class="bi bi-graph-up"></i></span>
                    <span>Графики из Grafana</span>
                </span>
            </a>
            <a class="sidebar-link" th:href="@{/configuration}"
               th:classappend="${activePage} == 'configuration' ? ' active' : ''">
                <span class="sidebar-item">
                    <span class="menu-icon"><i class="bi bi-gear"></i></span>
                    <span>Конфигурация DropApp</span>
                </span>
            </a>
            <a class="sidebar-link"
               th:href="@{/settings/connections}"
               th:classappend="${activePage} == 'settings' ? ' active' : ''">
                <span class="sidebar-item">
                    <span class="menu-icon"><i class="bi bi-sliders"></i></span>
                    <span>Настройки</span>
                </span>
            </a>
            <div class="sidebar-submenu">
                <a class="sidebar-sublink"
                   th:href="@{/settings/connections}"
                   th:classappend="${activeSettingsSection} == 'connections' ? ' active' : ''">
                    <span class="sidebar-item">
                        <span class="menu-icon"><i class="bi bi-plug"></i></span>
                        <span>Подключения</span>
                    </span>
                </a>
                <a class="sidebar-sublink"
                   th:href="@{/settings/templates}"
                   th:classappend="${activeSettingsSection} == 'templates' ? ' active' : ''">
                    <span class="sidebar-item">
                        <span class="menu-icon"><i class="bi bi-file-earmark-text"></i></span>
                        <span>Шаблоны отчетов</span>
                    </span>
                </a>
                <a class="sidebar-sublink"
                   th:href="@{/settings/grafana-dashboards}"
                   th:classappend="${activeSettingsSection} == 'grafana-dashboards' ? ' active' : ''">
                    <span class="sidebar-item">
                        <span class="menu-icon"><i class="bi bi-graph-up"></i></span>
                        <span>Графики и нефункциональные требования</span>
                    </span>
                </a>
            </div>
        </div>
    </aside>

    <div class="page-content">
<main class="container-fluid py-5 px-4 px-lg-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h5 class="mb-1">Запросы Victoria Metrics</h5>
            <p class="text-muted small mb-0">Добавляйте и редактируйте выражения PromQL.</p>
        </div>
        <button type="button" class="btn btn-success" id="addQueryButton">Добавить запрос</button>
    </div>
    <div id="queriesStatus" class="alert d-none" role="alert"></div>
    <div id="queriesList"></div>
    <div id="queriesEmpty" class="text-muted">Запросы не найдены.</div>
</main>

    </div>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9K/Y/xFd25tOfvtTDHkJ/xZBfX0Ax7Anxr1Lk0XG"
        crossorigin="anonymous"></script>
<script>
    const queriesList = document.getElementById('queriesList');
    const queriesEmpty = document.getElementById('queriesEmpty');
    const queriesStatus = document.getElementById('queriesStatus');
    const addQueryButton = document.getElementById('addQueryButton');

    function setQueriesStatus(message, type = 'info') {
        queriesStatus.textContent = message;
        queriesStatus.className = `alert alert-${type}`;
        queriesStatus.classList.remove('d-none');
    }

    function clearQueriesStatus() {
        queriesStatus.classList.add('d-none');
    }

    function renderQueries(items) {
        queriesList.innerHTML = '';
        if (!items.length) {
            queriesEmpty.classList.remove('d-none');
            return;
        }
        queriesEmpty.classList.add('d-none');
        items.forEach(item => {
            queriesList.appendChild(buildQueryCard(item));
        });
    }

    function buildQueryCard(item) {
        const card = document.createElement('div');
        card.className = 'card query-card';
        card.dataset.queryId = item?.id ?? '';
        card.dataset.isNew = (!item || !item.id).toString();

        const body = document.createElement('div');
        body.className = 'card-body';

        const row = document.createElement('div');
        row.className = 'row g-3';

        row.appendChild(buildInputColumn('col-md-4', 'Код запроса', 'code', item?.code ?? ''));
        row.appendChild(buildInputColumn('col-md-8', 'Описание', 'description', item?.description ?? ''));
        row.appendChild(buildTextareaColumn('col-12', 'Выражение PromQL', 'expression', item?.expression ?? ''));

        body.appendChild(row);

        const footer = document.createElement('div');
        footer.className = 'd-flex justify-content-between align-items-center mt-3';
        const meta = document.createElement('div');
        meta.className = 'text-muted small';
        meta.textContent = item?.id ? `ID ${item.id}` : 'Новая запись';
        footer.appendChild(meta);

        const actions = document.createElement('div');
        actions.className = 'd-flex gap-2';

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'btn btn-outline-danger btn-sm';
        deleteButton.textContent = 'Удалить';
        deleteButton.addEventListener('click', () => deleteQuery(card));

        const saveButton = document.createElement('button');
        saveButton.type = 'button';
        saveButton.className = 'btn btn-success btn-sm';
        saveButton.textContent = 'Сохранить';
        saveButton.addEventListener('click', () => saveQuery(card));

        actions.appendChild(deleteButton);
        actions.appendChild(saveButton);
        footer.appendChild(actions);
        body.appendChild(footer);

        card.appendChild(body);
        return card;
    }

    function buildInputColumn(colClass, labelText, field, value) {
        const col = document.createElement('div');
        col.className = colClass;
        const label = document.createElement('label');
        label.className = 'form-label';
        label.textContent = labelText;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'form-control query-input';
        input.dataset.field = field;
        input.value = value ?? '';
        col.appendChild(label);
        col.appendChild(input);
        return col;
    }

    function buildTextareaColumn(colClass, labelText, field, value) {
        const col = document.createElement('div');
        col.className = colClass;
        const label = document.createElement('label');
        label.className = 'form-label';
        label.textContent = labelText;
        const textarea = document.createElement('textarea');
        textarea.className = 'form-control query-input expression-input';
        textarea.rows = 6;
        textarea.dataset.field = field;
        textarea.value = value ?? '';
        col.appendChild(label);
        col.appendChild(textarea);
        return col;
    }

    function getQueryPayload(card) {
        const payload = {};
        const inputs = card.querySelectorAll('.query-input');
        inputs.forEach(input => {
            payload[input.dataset.field] = input.value;
        });
        return payload;
    }

    async function loadQueries() {
        setQueriesStatus('Загружаем запросы…');
        try {
            const response = await fetch('/api/settings/victoria-metrics-queries');
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            const data = await response.json();
            renderQueries(data);
            clearQueriesStatus();
        } catch (error) {
            setQueriesStatus('Не удалось загрузить запросы: ' + error.message, 'danger');
        }
    }

    async function saveQuery(card) {
        try {
            const payload = getQueryPayload(card);
            if (!payload.code || !payload.code.trim()) {
                throw new Error('Код запроса обязателен.');
            }
            if (!payload.expression || !payload.expression.trim()) {
                throw new Error('Укажите выражение PromQL.');
            }
            const isNew = card.dataset.isNew === 'true';
            const id = card.dataset.queryId;
            const method = isNew ? 'POST' : 'PUT';
            const url = isNew
                    ? '/api/settings/victoria-metrics-queries'
                    : `/api/settings/victoria-metrics-queries/${id}`;
            const response = await fetch(url, {
                method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            const saved = await response.json();
            const updatedCard = buildQueryCard(saved);
            queriesList.replaceChild(updatedCard, card);
            setQueriesStatus('Запрос сохранен.', 'success');
        } catch (error) {
            setQueriesStatus(error.message, 'danger');
        }
    }

    async function deleteQuery(card) {
        const isNew = card.dataset.isNew === 'true';
        if (isNew) {
            card.remove();
            if (!queriesList.children.length) {
                queriesEmpty.classList.remove('d-none');
            }
            return;
        }
        if (!confirm('Удалить запрос?')) {
            return;
        }
        try {
            const id = card.dataset.queryId;
            const response = await fetch(`/api/settings/victoria-metrics-queries/${id}`, {method: 'DELETE'});
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            card.remove();
            setQueriesStatus('Запрос удален.', 'success');
            if (!queriesList.children.length) {
                queriesEmpty.classList.remove('d-none');
            }
        } catch (error) {
            setQueriesStatus('Не удалось удалить запрос: ' + error.message, 'danger');
        }
    }

    function addQuery() {
        const card = buildQueryCard(null);
        queriesList.prepend(card);
        queriesEmpty.classList.add('d-none');
    }

    addQueryButton.addEventListener('click', addQuery);

    (async function init() {
        await loadQueries();
    })();
</script>
</body>
</html>
