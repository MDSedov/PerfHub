<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Летописец — Конфигурация DropApp</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
    <style>
        body {
            background-color: #f5fff9;
            font-family: "SF Pro Display", "Roboto", "Segoe UI", sans-serif;
        }

        .navbar-sber {
            background: linear-gradient(90deg, #009846, #2cd67b);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(0, 132, 82, 0.3);
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #ffffff !important;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
        }

        .brand-logo {
            height: 42px;
            width: auto;
            border-radius: 14px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        .main-menu .nav-link {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            border-radius: 999px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .main-menu .nav-link.active,
        .main-menu .nav-link:hover,
        .main-menu .nav-link:focus-visible {
            background-color: #ffffff;
            color: #009846;
        }

        .main-menu .dropdown-toggle::after {
            margin-left: 0.35rem;
        }

        .dropdown-menu {
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 152, 70, 0.25);
            padding: 0.5rem;
            min-width: 16rem;
            max-width: min(22rem, calc(100vw - 1.5rem));
            left: auto;
            right: 0;
        }

        .dropdown-item {
            border-radius: 12px;
            padding: 0.5rem 0.9rem;
            font-weight: 500;
            color: #0b6b3c;
        }

        .dropdown-item.active,
        .dropdown-item:focus,
        .dropdown-item:hover {
            background-color: rgba(0, 152, 70, 0.12);
            color: #009846;
        }

        @media (min-width: 992px) {
            .nav-item.dropdown:hover .dropdown-menu {
                display: block;
                margin-top: 0;
            }
        }

        .card-config {
            border: none;
            border-radius: 20px;
            box-shadow: 0 16px 50px rgba(3, 76, 45, 0.08);
        }

        .table thead th {
            background-color: rgba(0, 152, 70, 0.08);
            border-bottom: none;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            color: #0b6b3c;
        }

        .table tbody td {
            vertical-align: middle;
            font-size: 0.95rem;
        }

        .btn-refresh {
            background: linear-gradient(135deg, #00b960, #2cd67b);
            border: none;
            font-weight: 600;
        }

        .btn-refresh:disabled {
            opacity: 0.7;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-sber">
    <div class="container-fluid align-items-center">
        <a class="navbar-brand text-decoration-none" th:href="@{/tests}">
            <img src="/img/chronicler-logo.png" alt="Летописец" class="brand-logo" loading="lazy">
            <span>Летописец</span>
        </a>
        <ul class="nav main-menu ms-3">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/tests}" th:classappend="${activePage} == 'tests' ? ' active' : ''">Тесты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/reports}" th:classappend="${activePage} == 'reports' ? ' active' : ''">Отчеты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/configuration}" th:classappend="${activePage} == 'configuration' ? ' active' : ''">Конфигурация</a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle"
                   href="#"
                   id="settingsMenu"
                   role="button"
                   data-bs-toggle="dropdown"
                   aria-expanded="false"
                   th:classappend="${activePage} == 'settings' ? ' active' : ''">
                    Настройки
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="settingsMenu">
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/connections}"
                           th:classappend="${activeSettingsSection} == 'connections' ? ' active' : ''">
                            Подключения
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/templates}"
                           th:classappend="${activeSettingsSection} == 'templates' ? ' active' : ''">
                            Шаблоны отчетов
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/grafana-dashboards}"
                           th:classappend="${activeSettingsSection} == 'grafana-dashboards' ? ' active' : ''">
                            Графики, запросы, требования
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<main class="container-fluid py-5 px-4 px-lg-5">
    <div class="card card-config">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between gap-3 align-items-center mb-4">
                <div>
                    <h5 class="card-title mb-1">Конфигурация DropApp</h5>
                    <p class="text-muted mb-0">Загружайте параметры ресурсов для выбранных namespace.</p>
                </div>
                <button type="button" class="btn btn-refresh text-white" id="loadDropAppConfig">
                    Получить текущую конфигурацию DropApp
                </button>
            </div>
            <div id="dropappConfigMessage" class="alert d-none" role="alert"></div>
            <div class="table-responsive d-none" id="dropappConfigTableWrapper">
                <table class="table table-hover" id="dropappConfigTable">
                    <thead>
                    <tr>
                        <th scope="col">Название POD</th>
                        <th scope="col">Контейнер в POD</th>
                        <th scope="col">Версия</th>
                        <th scope="col">Request CPU</th>
                        <th scope="col">Limit CPU</th>
                        <th scope="col">Request RAM</th>
                        <th scope="col">Limit RAM</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9K/Y/xFd25tOfvtTDHkJ/xZBfX0Ax7Anxr1Lk0XG"
        crossorigin="anonymous"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loadButton = document.getElementById('loadDropAppConfig');
        const messageBox = document.getElementById('dropappConfigMessage');
        const tableWrapper = document.getElementById('dropappConfigTableWrapper');
        const tableBody = document.querySelector('#dropappConfigTable tbody');

        const setMessage = (type, text) => {
            messageBox.className = 'alert alert-' + type;
            messageBox.textContent = text;
            messageBox.classList.remove('d-none');
        };

        const hideMessage = () => {
            messageBox.classList.add('d-none');
            messageBox.textContent = '';
        };

        const renderRows = (items) => {
            tableBody.innerHTML = '';
            items.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.podName ?? ''}</td>
                    <td>${item.containerName ?? ''}</td>
                    <td>${item.version ?? ''}</td>
                    <td>${item.requestCpu ?? ''}</td>
                    <td>${item.limitCpu ?? ''}</td>
                    <td>${item.requestRam ?? ''}</td>
                    <td>${item.limitRam ?? ''}</td>`;
                tableBody.appendChild(row);
            });
        };

        loadButton.addEventListener('click', async () => {
            hideMessage();
            loadButton.disabled = true;
            try {
                const response = await fetch('/api/dropapp/configuration', {headers: {'Accept': 'application/json'}});
                if (!response.ok) {
                    throw new Error('Сервер вернул статус ' + response.status);
                }
                const data = await response.json();
                if (!Array.isArray(data) || data.length === 0) {
                    tableWrapper.classList.add('d-none');
                    setMessage('warning', 'Конфигурация DropApp пуста. Проверьте настройки namespace.');
                    return;
                }
                renderRows(data);
                tableWrapper.classList.remove('d-none');
                setMessage('success', 'Конфигурация DropApp успешно загружена.');
            } catch (error) {
                tableWrapper.classList.add('d-none');
                setMessage('danger', 'Не удалось загрузить конфигурацию DropApp: ' + error.message);
            } finally {
                loadButton.disabled = false;
            }
        });
    });
</script>
</body>
</html>
