<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Летописец — Шаблоны отчетов</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
    <style>
        body {
            background-color: #f5fff9;
            font-family: "SF Pro Display", "Roboto", "Segoe UI", sans-serif;
        }

        .navbar-sber {
            background: linear-gradient(90deg, #009846, #2cd67b);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(0, 132, 82, 0.3);
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #ffffff !important;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
        }

        .brand-logo {
            height: 42px;
            width: auto;
            border-radius: 14px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        .main-menu .nav-link {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            border-radius: 999px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .main-menu .nav-link.active,
        .main-menu .nav-link:hover,
        .main-menu .nav-link:focus-visible {
            background-color: #ffffff;
            color: #009846;
        }

        .main-menu .dropdown-toggle::after {
            margin-left: 0.35rem;
        }

        .dropdown-menu {
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 152, 70, 0.25);
            padding: 0.5rem;
            min-width: 16rem;
            max-width: min(22rem, calc(100vw - 1.5rem));
            left: auto;
            right: 0;
        }

        .dropdown-item {
            border-radius: 12px;
            padding: 0.5rem 0.9rem;
            font-weight: 500;
            color: #0b6b3c;
        }

        .dropdown-item.active,
        .dropdown-item:focus,
        .dropdown-item:hover {
            background-color: rgba(0, 152, 70, 0.12);
            color: #009846;
        }

        @media (min-width: 992px) {
            .nav-item.dropdown:hover .dropdown-menu {
                display: block;
                margin-top: 0;
            }
        }

        .settings-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 16px 50px rgba(3, 76, 45, 0.08);
        }

        .accordion-button:focus {
            box-shadow: none;
        }

        .template-editor {
            font-family: "SF Mono", "JetBrains Mono", "Courier New", monospace;
            min-height: 220px;
        }

        .template-meta {
            font-size: 0.85rem;
            color: #4b5d54;
        }

        .toast-container {
            position: fixed;
            right: 1.25rem;
            bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 1080;
            max-width: 360px;
            align-items: flex-end;
            pointer-events: none;
        }

        .toast-item {
            background: #ffffff;
            border: 1px solid #e5efe8;
            border-radius: 10px;
            padding: 0.85rem 1rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            pointer-events: auto;
            width: 100%;
        }

        .toast-item .toast-body {
            margin: 0;
            color: #1f2b24;
        }

        .toast-close {
            border: none;
            background: transparent;
            color: #6a7c73;
            padding: 0.25rem;
            line-height: 1;
            cursor: pointer;
            margin-left: auto;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .toast-item.success {
            border-color: #b7e3c9;
            background: #f4fbf7;
        }

        .toast-item.danger {
            border-color: #f3c1b8;
            background: #fff4f2;
        }

        .toast-item.info {
            border-color: #c2d7ff;
            background: #f3f7ff;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-sber">
    <div class="container-fluid align-items-center">
        <a class="navbar-brand text-decoration-none" th:href="@{/tests}">
            <img src="/img/chronicler-logo.png" alt="Летописец" class="brand-logo" loading="lazy">
            <span>Летописец</span>
        </a>
        <ul class="nav main-menu ms-3">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/tests}" th:classappend="${activePage} == 'tests' ? ' active' : ''">Тесты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/reports}" th:classappend="${activePage} == 'reports' ? ' active' : ''">Отчеты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/configuration}" th:classappend="${activePage} == 'configuration' ? ' active' : ''">Конфигурация</a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle"
                   href="#"
                   id="settingsMenu"
                   role="button"
                   data-bs-toggle="dropdown"
                   aria-expanded="false"
                   th:classappend="${activePage} == 'settings' ? ' active' : ''">
                    Настройки
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="settingsMenu">
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/connections}"
                           th:classappend="${activeSettingsSection} == 'connections' ? ' active' : ''">
                            Подключения
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/templates}"
                           th:classappend="${activeSettingsSection} == 'templates' ? ' active' : ''">
                            Шаблоны отчетов
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item"
                           th:href="@{/settings/grafana-dashboards}"
                           th:classappend="${activeSettingsSection} == 'grafana-dashboards' ? ' active' : ''">
                            Графики и нефункциональные требования
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<main class="container-fluid py-5 px-4 px-lg-5">
    <div class="card settings-card">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <div>
                    <h5 class="card-title mb-1">Шаблоны отчетов</h5>
                    <p class="text-muted small mb-0">Всего <span id="templatesCount">0</span> шаблонов</p>
                </div>
                <button type="button" class="btn btn-success" id="saveTemplatesButton" disabled>Сохранить</button>
            </div>
            <div id="templatesStatus" class="alert d-none" role="alert"></div>
            <div id="templatesAccordion" class="accordion"></div>
            <div id="templatesEmpty" class="text-muted d-none">Шаблоны не найдены.</div>
        </div>
    </div>
</main>

<div id="toastContainer" class="toast-container"></div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9K/Y/xFd25tOfvtTDHkJ/xZBfX0Ax7Anxr1Lk0XG"
        crossorigin="anonymous"></script>

<script>
    const templatesAccordion = document.getElementById('templatesAccordion');
    const templatesStatus = document.getElementById('templatesStatus');
    const templatesEmpty = document.getElementById('templatesEmpty');
    const templatesCount = document.getElementById('templatesCount');
    const saveTemplatesButton = document.getElementById('saveTemplatesButton');
    const toastContainer = document.getElementById('toastContainer');

    const templateChanges = new Map();
    let templatesCache = [];
    let isSaving = false;
    const bootstrapCollapseConstructor =
        window.bootstrap && typeof window.bootstrap.Collapse === 'function'
            ? window.bootstrap.Collapse
            : null;

    const removeToast = (toast) => {
        if (!toast) {
            return;
        }
        const timerId = toast.dataset.timerId;
        if (timerId) {
            clearTimeout(Number(timerId));
        }
        toast.remove();
    };

    const showToast = (message, type = 'info', durationMs = 12000) => {
        if (!toastContainer) {
            return null;
        }
        const toast = document.createElement('div');
        toast.className = `toast-item ${type}`;
        const body = document.createElement('p');
        body.className = 'toast-body';
        body.textContent = message;
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'toast-close';
        close.setAttribute('aria-label', 'Закрыть уведомление');
        close.innerHTML = '&times;';
        close.addEventListener('click', () => removeToast(toast));
        const content = document.createElement('div');
        content.className = 'flex-grow-1';
        content.appendChild(body);
        toast.appendChild(content);
        toast.appendChild(close);
        toastContainer.appendChild(toast);
        const timer = setTimeout(() => removeToast(toast), durationMs);
        toast.dataset.timerId = timer.toString();
        return toast;
    };

    if (toastContainer) {
        toastContainer.addEventListener('click', event => {
            const closeButton = event.target.closest('.toast-close');
            if (!closeButton) {
                return;
            }
            const toast = closeButton.closest('.toast-item');
            removeToast(toast);
        });
    }

    function setTemplatesStatus(message, type = 'info') {
        templatesStatus.textContent = message;
        templatesStatus.className = `alert alert-${type} visually-hidden`;
        showToast(message, type);
    }

    function clearTemplatesStatus() {
        templatesStatus.className = 'alert d-none';
        templatesStatus.textContent = '';
    }

    function toggleSaveTemplatesButton() {
        saveTemplatesButton.disabled = templateChanges.size === 0 || isSaving;
    }

    function renderTemplates(items) {
        templatesAccordion.innerHTML = '';
        templateChanges.clear();
        toggleSaveTemplatesButton();

        if (templatesCount) {
            templatesCount.textContent = items.length.toString();
        }

        if (!items.length) {
            templatesAccordion.classList.add('d-none');
            templatesEmpty.classList.remove('d-none');
            return;
        }

        templatesAccordion.classList.remove('d-none');
        templatesEmpty.classList.add('d-none');

        items.forEach((item, index) => {
            const accordionItem = document.createElement('div');
            accordionItem.className = 'accordion-item';

            const headerId = `templateHeading${item.id}`;
            const collapseId = `templateCollapse${item.id}`;

            const header = document.createElement('h2');
            header.className = 'accordion-header';
            header.id = headerId;

            const button = document.createElement('button');
            button.className = `accordion-button${index === 0 ? '' : ' collapsed'}`;
            button.type = 'button';
            button.setAttribute('data-bs-toggle', 'collapse');
            button.setAttribute('data-bs-target', `#${collapseId}`);
            button.setAttribute('aria-expanded', index === 0 ? 'true' : 'false');
            button.setAttribute('aria-controls', collapseId);
            button.textContent = item.name;

            header.appendChild(button);
            accordionItem.appendChild(header);

            const bodyWrapper = document.createElement('div');
            bodyWrapper.id = collapseId;
            bodyWrapper.className = `accordion-collapse collapse${index === 0 ? ' show' : ''}`;
            bodyWrapper.setAttribute('aria-labelledby', headerId);

            const body = document.createElement('div');
            body.className = 'accordion-body';

            const meta = document.createElement('p');
            meta.className = 'template-meta mb-3';
            meta.textContent = `Тип теста: ${item.testType}`;

            const textarea = document.createElement('textarea');
            textarea.className = 'form-control template-editor';
            textarea.rows = 12;
            textarea.value = item.text ?? '';
            textarea.dataset.templateId = item.id;
            const originalValue = textarea.value;

            textarea.addEventListener('input', () => {
                const currentValue = textarea.value;
                if (currentValue === originalValue) {
                    templateChanges.delete(item.id);
                } else {
                    templateChanges.set(item.id, currentValue);
                }
                toggleSaveTemplatesButton();
            });

            body.appendChild(meta);
            body.appendChild(textarea);
            bodyWrapper.appendChild(body);
            accordionItem.appendChild(bodyWrapper);
            templatesAccordion.appendChild(accordionItem);

            const collapseInstance = bootstrapCollapseConstructor
                ? new bootstrapCollapseConstructor(bodyWrapper, {toggle: false})
                : null;

            button.addEventListener('click', event => {
                event.preventDefault();
                event.stopPropagation();

                if (collapseInstance) {
                    collapseInstance.toggle();
                    return;
                }

                const willShow = !bodyWrapper.classList.contains('show');
                bodyWrapper.classList.toggle('show', willShow);
                button.classList.toggle('collapsed', !willShow);
                button.setAttribute('aria-expanded', willShow.toString());
            });
        });
    }

    async function loadTemplates() {
        setTemplatesStatus('Загружаем шаблоны…');
        try {
            const response = await fetch('/api/settings/confluence-templates');
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            templatesCache = await response.json();
            renderTemplates(templatesCache);
            clearTemplatesStatus();
        } catch (error) {
            setTemplatesStatus('Не удалось загрузить шаблоны: ' + error.message, 'danger');
        }
    }

    async function saveTemplates() {
        if (templateChanges.size === 0) {
            return;
        }
        isSaving = true;
        toggleSaveTemplatesButton();
        setTemplatesStatus('Сохраняем изменения…');
        const payload = {
            templates: Array.from(templateChanges.entries()).map(([id, text]) => ({
                id,
                text
            }))
        };
        try {
            const response = await fetch('/api/settings/confluence-templates', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                throw new Error('Ответ сервера: ' + response.status);
            }
            templatesCache = await response.json();
            renderTemplates(templatesCache);
            setTemplatesStatus('Шаблоны сохранены.', 'success');
        } catch (error) {
            setTemplatesStatus('Не удалось сохранить шаблоны: ' + error.message, 'danger');
        } finally {
            isSaving = false;
            toggleSaveTemplatesButton();
        }
    }

    saveTemplatesButton.addEventListener('click', saveTemplates);

    (async function init() {
        await loadTemplates();
    })();
</script>
</body>
</html>
